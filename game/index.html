<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beat Eve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a signals desk. Alice on the left, the tapped wire (Eve) in the middle, Bob on the right.
   Missions sit on a dispatch board grouped by chapter. Key colors are semantic and never decorative. */
:root{
  --bg:#E6EBF1; --panel:#F8FAFC; --panel2:#EDF1F6; --ink:#121B2A; --muted:#566377; --line:#C5CFDB;
  --accent:#2944D6; --accent-ink:#FFFFFF; --accent-soft:#DCE3FB;
  --eve:#8A3BC2; --eve-soft:#F0E4F8; --good:#157F55; --good-soft:#DDF2E8; --bad:#C22E3A; --bad-soft:#F9E0E2; --warn:#A86B12;
  --k-shared:#B57C00; --k-bob:#0A8784; --k-alice:#CF4E2C; --k-mal:#6B5C9C; --k-ca:#3B5B8C;
  --f-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  --shadow:0 1px 0 rgba(18,27,42,.05),0 8px 22px -14px rgba(18,27,42,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131E; --panel:#151D2B; --panel2:#1B2536; --ink:#E5EBF4; --muted:#96A2B5; --line:#2B374B;
    --accent:#8198FF; --accent-ink:#0D131E; --accent-soft:#1E2A52;
    --eve:#C58CF2; --eve-soft:#2C1D3B; --good:#4CC48C; --good-soft:#15342A; --bad:#FF6E73; --bad-soft:#3A1B20; --warn:#E3A64A;
    --k-shared:#F0B535; --k-bob:#39C6BF; --k-alice:#FF8866; --k-mal:#AA9BE0; --k-ca:#8FB0E6;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131E; --panel:#151D2B; --panel2:#1B2536; --ink:#E5EBF4; --muted:#96A2B5; --line:#2B374B;
  --accent:#8198FF; --accent-ink:#0D131E; --accent-soft:#1E2A52;
  --eve:#C58CF2; --eve-soft:#2C1D3B; --good:#4CC48C; --good-soft:#15342A; --bad:#FF6E73; --bad-soft:#3A1B20; --warn:#E3A64A;
  --k-shared:#F0B535; --k-bob:#39C6BF; --k-alice:#FF8866; --k-mal:#AA9BE0; --k-ca:#8FB0E6;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;font-size:18px;display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:4px 0}
.brand .eye{width:26px;height:26px}
.top .spacer{flex:1}
.starcount{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;transition:transform .08s,background .15s}
.btn:hover{background:var(--panel2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:36px 20px}
.hero h1{font-size:clamp(44px,8vw,92px);letter-spacing:.02em;line-height:.9;font-weight:700}
.hero h1 span{color:var(--eve)}
.hero p{font-size:19px;max-width:34ch;margin:16px 0 0}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.stage svg{width:100%;height:auto;display:block}
.cast{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-block:8px 28px}
.cast div{border-top:3px solid var(--c);padding-top:8px}
.cast b{font-family:var(--f-display);font-size:18px;display:block}
.cast small{color:var(--muted);font-size:14px}
.chapter{margin-block:26px}
.chapter-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.chapter-head .num{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.1em}
.chapter-head h2{font-size:26px}
.chapter-head .slides{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile h3{font-size:21px}
.tile p{margin:0;color:var(--muted);font-size:15px}
.tile .tag{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.stars{display:inline-flex;gap:2px}
.stars svg{width:18px;height:18px}
.teacher{margin-top:36px;border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:15px;max-width:75ch}

/* mission shell */
.mhead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-block:22px 12px}
.mhead h2{font-size:clamp(28px,4.5vw,40px)}
.mhead .kicker{font-family:var(--f-mono);font-size:13px;color:var(--accent);margin-bottom:6px}
.story{max-width:72ch;font-size:17px;margin:0 0 12px}
.goals{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.goal{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px 4px 8px;font-size:14px}
.goal i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.goal.done{border-color:var(--good);background:var(--good-soft)}
.goal.done i{background:var(--good)}
.hintbox{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:15px}

/* courier bench */
.bench{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel h3 .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.items{display:flex;flex-direction:column;gap:8px}
.deskitem{border-radius:9px;cursor:pointer;outline-offset:2px}
.sentmark{display:block;margin:3px 0 0 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--good)}
.deskitem.sel>.it{box-shadow:0 0 0 3px var(--accent)}
.it{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 10px;min-width:0}
.it>div{min-width:0}
.it b{display:block;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.it small{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.it .ic{width:26px;height:26px;flex:none;margin-top:1px}
.it.key{border-left:4px solid var(--kc)}
.badge{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;padding:1px 6px;border-radius:4px;border:1px solid currentColor;margin-left:4px;vertical-align:2px}
.badge.priv{color:var(--bad)}
.badge.pub{color:var(--good)}
.badge.sec{color:var(--k-shared)}
.it.box{flex-direction:column;gap:6px;border:2px solid var(--kc);background:transparent}
.box-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.box-head .ic{width:20px;height:20px}
.box-in{width:100%;padding-left:10px;border-left:2px dashed var(--kc)}
.box-sealed{font-size:13px;color:var(--muted);font-style:italic}
.it.leak{box-shadow:0 0 0 2px var(--bad);background:var(--bad-soft)}
.it .leaktag{color:var(--bad);font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;font-weight:600}
.actions{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.actions .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.keybtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--kc);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:14px;font-weight:700}
.keybtn .ic{width:18px;height:18px}
.keybtn:hover{background:var(--panel2)}
.empty{color:var(--muted);font-size:14px;font-style:italic}
.pipe{position:relative;height:74px;margin-block:4px 10px}
.pipe .line{position:absolute;left:4px;right:4px;top:22px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 16px)}
.pipe .endA,.pipe .endB{position:absolute;top:14px;width:20px;height:20px;border-radius:50%;border:3px solid var(--c);background:var(--panel)}
.pipe .endA{left:0}.pipe .endB{right:0}
.pipe .tap{position:absolute;left:50%;top:24px;width:2px;height:24px;background:var(--eve);transform:translateX(-50%)}
.pipe .evebug{position:absolute;left:50%;top:44px;transform:translateX(-50%);width:34px;height:26px}
.pipe .evebug.flash{animation:blink .5s}
@keyframes blink{50%{transform:translateX(-50%) scale(1.35)}}
.packet{position:absolute;top:12px;left:0;width:24px;height:24px;border-radius:6px;background:var(--accent);box-shadow:0 0 0 3px var(--panel);animation:travel .95s ease-in-out forwards}
@keyframes travel{from{left:0}to{left:calc(100% - 24px)}}
.evehead{color:var(--eve)}
.log{margin-top:14px;font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:150px;overflow:auto}
.log div::before{content:"› ";color:var(--accent)}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,12,20,.55);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--panel);color:var(--ink);border-radius:14px;max-width:620px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px;border-top:6px solid var(--tone,var(--accent));box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.modal-card h2{font-size:28px;margin-bottom:10px}
.modal-card ul{padding-left:20px;margin:8px 0}
.modal-card li{margin-bottom:6px}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:18px}
.bigstars{display:flex;gap:6px;margin:4px 0 12px}
.bigstars svg{width:40px;height:40px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(560px,calc(100% - 32px));background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 16px;font-size:15px;box-shadow:var(--shadow);animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}

/* generic mission surfaces */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:20px;margin-bottom:8px}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.swatch{width:62px;height:62px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;display:grid;place-items:end center;padding-bottom:0;position:relative}
.swatch span{position:absolute;bottom:-22px;font-size:12px;white-space:nowrap;color:var(--muted)}
.swatch.sel{box-shadow:0 0 0 3px var(--accent)}
.swrow{display:flex;flex-wrap:wrap;gap:14px 16px;padding-bottom:22px}
.pot{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:14px}
.pot .blob{width:84px;height:84px;border-radius:50% 50% 46% 46%;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),0 0 0 1px var(--line)}
.pots{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:center;margin-block:10px}
.eq{font-family:var(--f-mono);font-size:15px;background:var(--panel2);border-radius:8px;padding:10px 12px;overflow-x:auto}
.clockwrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.clock{width:min(300px,100%);height:auto;flex:none}
.bigval{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1}
.qwrap{max-width:720px}
.q{margin-bottom:14px}
.q .opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 12px;cursor:pointer}
.opt:hover{background:var(--panel2)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.bin{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:14px 10px;cursor:pointer;font-weight:700;font-family:var(--f-display);font-size:17px}
.bin:hover{border-color:var(--accent)}
.bin.right{border-color:var(--good);background:var(--good-soft)}
.bin.wrong{border-color:var(--bad);background:var(--bad-soft)}
.sort-q{font-family:var(--f-body);font-weight:700;font-size:19px;line-height:1.4}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.explain{font-size:15px;margin-top:8px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--panel2)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;cursor:pointer}
.step .n{font-family:var(--f-mono);min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-size:13px}
.step.placed{border-color:var(--good);background:var(--good-soft);cursor:default}
.step.placed .n{background:var(--good);color:var(--panel)}
.step.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sessions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sess{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:6px;min-height:150px}
.sess b{font-family:var(--f-display);font-size:17px}
.sess .st{font-size:13px;font-family:var(--f-mono)}
.sess.exposed{border-color:var(--bad);background:var(--bad-soft)}
.sess.safe{border-color:var(--good);background:var(--good-soft)}
.timerbar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.timerbar i{display:block;height:100%;background:var(--warn);width:100%}

/* checkpoint */
.cp{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
.hud{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-family:var(--f-mono);font-size:14px;margin-bottom:10px}
.hud b{font-size:18px}
.addr{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-family:var(--f-mono);font-size:15px;overflow-x:auto;white-space:nowrap}
.cert{margin-top:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:16px 18px;position:relative;background-image:repeating-linear-gradient(135deg,transparent 0 14px,var(--panel2) 14px 15px)}
.cert h4{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--k-ca);margin-bottom:10px}
.cert dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:15px}
.cert dt{color:var(--muted);font-size:13px;padding-top:2px}
.cert dd{margin:0;font-family:var(--f-mono);font-size:14px;overflow-wrap:anywhere}
.chain{display:flex;flex-direction:column;gap:2px}
.chain span::before{content:"↳ ";color:var(--muted)}
.chain span:first-child::before{content:""}
.sigok{color:var(--good)}.sigbad{color:var(--bad)}
.verdicts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.verdicts .trust{grid-column:1/-1}
.vbtn{border:2px solid var(--line);background:var(--panel);border-radius:8px;padding:10px;cursor:pointer;font-weight:700;font-size:14px}
.vbtn:hover{border-color:var(--bad)}
.vbtn.trust{border-color:var(--good);background:var(--good-soft)}
.manual h4{font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin:12px 0 6px;color:var(--muted)}
.manual h4:first-child{margin-top:0}
.manual ul{list-style:none;padding:0;margin:0;font-family:var(--f-mono);font-size:13px;display:flex;flex-direction:column;gap:3px}
.manual li{overflow-wrap:anywhere}
.ocsp{margin-top:6px;font-family:var(--f-mono);font-size:13px;padding:8px 10px;border-radius:6px;background:var(--panel2)}
.strikes{display:inline-flex;gap:4px}
.strikes i{width:14px;height:14px;border-radius:3px;border:2px solid var(--bad);display:inline-block}
.strikes i.on{background:var(--bad)}
.picker{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.picker .cert{cursor:pointer;margin:0}
.picker .cert:hover{outline:3px solid var(--accent)}


/* characters, briefings, codes */

.stage-row{display:flex;align-items:center;gap:12px}
.who{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.who span{font-family:var(--f-display);font-size:13px;color:var(--muted);max-width:16ch}
.pt-lg{width:78px;height:78px}
.pt-lg .pt{width:78px;height:78px}
.stage-wire{flex:1;position:relative;height:24px;min-width:60px}
.wire-dash{position:absolute;inset:50% 0 auto 0;height:4px;border-radius:2px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 16px)}
.packet{position:absolute;top:50%;left:0;width:26px;height:26px;margin-top:-13px;border-radius:6px;background:var(--k-shared);display:grid;place-items:center;box-shadow:0 0 0 3px var(--panel);animation:heroPk 3.2s ease-in-out infinite}
@keyframes heroPk{0%{left:0}50%{left:calc(100% - 26px)}100%{left:0}}
.eve-tap{margin:6px auto 0;position:relative;padding-top:16px}
.tap-line{position:absolute;top:-2px;left:50%;width:2px;height:18px;background:var(--eve);transform:translateX(-50%)}
.eve-tap .pt-lg{width:60px;height:60px}
.eve-tap .pt{width:60px;height:60px}
@media (prefers-reduced-motion:reduce){.packet{animation:none;left:calc(50% - 13px)}}


.tablewrap{overflow-x:auto}
table.db{border-collapse:collapse;width:100%;font-size:14px}
table.db th,table.db td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.db th{font-family:var(--f-display);font-size:12px;letter-spacing:.06em;color:var(--muted)}
table.db tr.sel td{background:var(--accent-soft)}
table.db tr.got td{background:var(--good-soft)}
table.db.rb tbody tr{cursor:pointer}
table.db.rb tbody tr:hover td{background:var(--panel2)}
.ledger{display:flex;flex-wrap:wrap;gap:0;align-items:stretch;margin-bottom:14px}
.block{flex:1 1 190px;min-width:180px;border:2px solid var(--good);border-radius:10px;background:var(--panel);padding:10px;position:relative;box-shadow:var(--shadow)}
.block.bad{border-color:var(--bad)}
.block.edited{outline:2px dashed var(--warn);outline-offset:2px}
.blk-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ok-tag{color:var(--good);font-family:var(--f-mono);font-size:11px;font-weight:600}
.bad-tag{color:var(--bad);font-family:var(--f-mono);font-size:11px;font-weight:600}
.blk-body label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.blk-body .small{font-size:12px;overflow-wrap:anywhere;white-space:normal}
.blk-body .mism{color:var(--bad);text-decoration:line-through}
.blk-what{flex:1 1 120px}
.chain-link{position:absolute;right:-11px;top:50%;width:20px;height:4px;background:var(--good);transform:translateY(-50%);z-index:1}
.chain-link.cut{background:var(--bad);height:0;border-top:4px dashed var(--bad)}
.block.bad .chain-link{background:var(--bad)}
.warn-h{color:var(--bad)}
.stego{border:1px solid var(--line);border-radius:8px;overflow:hidden;line-height:0}
@media (max-width:560px){.block{flex:1 1 100%}.chain-link{display:none}}

.pt{width:56px;height:56px;flex:none;display:block}
.cast{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.cast div{display:flex;gap:10px;align-items:flex-start;min-width:0}
.cast .pt{width:48px;height:48px}
.cast span{min-width:0}
.tile-top{display:flex;align-items:center;gap:10px}
.tile-pt{width:44px;height:44px}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.brief{display:flex;flex-direction:column;gap:14px;max-width:780px}
.line{display:flex;gap:12px;align-items:flex-end;animation:rise .45s both}
.line.me{flex-direction:row-reverse;align-self:flex-end}
.line .pt{width:64px;height:64px}
.bubble{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);min-width:0;max-width:62ch}
.line.me .bubble{border-left-width:1px;border-right:4px solid var(--c)}
.bubble b{font-family:var(--f-display);font-size:15px;letter-spacing:.04em}
.bubble p{margin:2px 0 0;font-size:17px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.panel h3 .pt{width:30px;height:30px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{font:inherit;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:8px 10px;min-width:0;flex:1 1 180px}
.codebox{border:1px dashed var(--accent);border-radius:10px;padding:12px;margin:12px 0;display:flex;flex-direction:column;gap:6px}
.code{font-family:var(--f-mono);font-size:19px;font-weight:600;letter-spacing:.06em;background:var(--panel2);padding:6px 10px;border-radius:6px;user-select:all;overflow-wrap:anywhere}
.report{margin-top:30px}
.report .chapter-head{margin-bottom:6px}
.rc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.rc-grid>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.rc-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:15px}
.rc-list li{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-block:3px}
.rc-mini{list-style:none;padding:0;margin:6px 0 0;font-size:14px}
.vf{display:flex;flex-direction:column;gap:8px}
.soundbtn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;display:grid;place-items:center}
.soundbtn:hover{background:var(--panel2)}
.teacher .btn{margin-top:4px}

@media (max-width:900px){
  .bench{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr)}
  .tiles,.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rc-grid{grid-template-columns:minmax(0,1fr)}
  .cp,.two,.picker{grid-template-columns:minmax(0,1fr)}
  .sessions{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .tiles,.tiles.four,.sessions{grid-template-columns:minmax(0,1fr)}
  .line .pt{width:48px;height:48px}
  .bubble p{font-size:16px}
  .cast{grid-template-columns:repeat(2,minmax(0,1fr))}
  .verdicts{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .hero p{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <button class="brand" id="homeBtn" type="button" aria-label="Back to mission board">
      <svg class="eye" viewBox="0 0 32 24" aria-hidden="true"><path d="M2 12C7 4 25 4 30 12C25 20 7 20 2 12Z" fill="none" stroke="var(--eve)" stroke-width="2.4"/><circle cx="16" cy="12" r="4.5" fill="var(--eve)"/></svg>
      BEAT EVE
    </button>
    <span class="spacer"></span>
    <button type="button" class="soundbtn" id="soundBtn" aria-label="Sound on" aria-pressed="true"></button>
    <span class="starcount" id="starCount" aria-live="polite"></span>
  </div>
</header>
<main class="wrap" id="screen"></main>
<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const screen=$('#screen');
let cleanup=null, current=null;

/* ---------- SHA-256 (real, synchronous; used for hashing, mining and completion codes) ---------- */
const sha256=(()=>{
  const primes=[];for(let n=2;primes.length<64;n++){if(primes.every(p=>n%p))primes.push(n);}
  const frac=x=>Math.floor((x-Math.floor(x))*4294967296)|0;
  const K=primes.map(p=>frac(Math.cbrt(p))), H0=primes.slice(0,8).map(p=>frac(Math.sqrt(p)));
  const enc=new TextEncoder();
  return function(msg){
    const bytes=enc.encode(msg),l=bytes.length,buf=new Uint8Array(((l+9+63)>>6)<<6);
    buf.set(bytes);buf[l]=0x80;
    const dv=new DataView(buf.buffer);dv.setUint32(buf.length-4,(l*8)>>>0);dv.setUint32(buf.length-8,Math.floor(l/536870912));
    const H=H0.slice(),W=new Int32Array(64);
    for(let i=0;i<buf.length;i+=64){
      for(let t=0;t<16;t++)W[t]=dv.getInt32(i+t*4);
      for(let t=16;t<64;t++){const x=W[t-15],y=W[t-2];
        W[t]=(W[t-16]+((x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3))+W[t-7]+((y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10)))|0;}
      let [a,b,c,d,e,f,g,h]=H;
      for(let t=0;t<64;t++){
        const t1=(h+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+((e&f)^(~e&g))+K[t]+W[t])|0;
        const t2=(((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10))+((a&b)^(a&c)^(b&c)))|0;
        h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
    }
    return H.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
  };
})();

/* ---------- sound (synthesized with Web Audio; no files) ---------- */
const SFX=(()=>{
  let ctx=null,on=true;
  try{on=localStorage.getItem('beatEve.sound')!=='off';}catch(e){}
  function ac(){
    if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ctx=new C();}
    if(ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  function tone(f,t0,dur,type,vol,f2){
    const c=ac();if(!c)return;
    const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.06,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.03);
  }
  const S={
    click:()=>tone(880,0,.05,'triangle',.035),
    lock:()=>{tone(330,0,.06,'square',.045);tone(247,.07,.1,'square',.045);},
    hash:()=>{for(let i=0;i<5;i++)tone(620+i*150,i*.035,.05,'triangle',.03);},
    send:()=>tone(280,0,.4,'sine',.06,1150),
    alarm:()=>{for(let i=0;i<4;i++)tone(i%2?560:780,i*.15,.13,'sawtooth',.045);},
    win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.26,'triangle',.07)),
    fail:()=>{tone(300,0,.28,'sawtooth',.05,150);tone(200,.25,.4,'sawtooth',.045,90);},
    good:()=>{tone(660,0,.08,'triangle',.06);tone(990,.08,.16,'triangle',.06);},
    bad:()=>tone(190,0,.22,'square',.045,120),
    tick:()=>tone(1250,0,.025,'square',.02),
    turn:()=>tone(430,0,.07,'triangle',.045,540),
    coin:()=>{tone(988,0,.06,'square',.035);tone(1319,.06,.14,'square',.035);},
    pour:()=>tone(240,0,.3,'sine',.05,95),
    mine:()=>{for(let i=0;i<3;i++)tone(150+i*40,i*.05,.05,'square',.03);},
  };
  return {play(n){if(on&&S[n]){try{S[n]();}catch(e){}}},get on(){return on;},toggle(){on=!on;try{localStorage.setItem('beatEve.sound',on?'on':'off');}catch(e){}if(on)S.click();return on;}};
})();

/* ---------- progress ---------- */
const STORE='beatEve.progress.v1';
let progress={};
try{progress=JSON.parse(localStorage.getItem(STORE))||{};}catch(e){progress={};}
function award(id,n){
  if((progress[id]||0)<n){progress[id]=n;try{localStorage.setItem(STORE,JSON.stringify(progress));}catch(e){}}
  drawStarCount();
}
function totalStars(){return Object.keys(MISSIONS).reduce((a,id)=>a+(progress[id]||0),0);}
function drawStarCount(){$('#starCount').innerHTML=`${ICON.star(true)} ${totalStars()} / ${Object.keys(MISSIONS).length*3}`;}
let studentName='';
try{studentName=localStorage.getItem('beatEve.name')||'';}catch(e){}
function setName(n){studentName=String(n||'').trim().slice(0,60);try{localStorage.setItem('beatEve.name',studentName);}catch(e){}}

/* ---------- completion codes ----------
   A code is a keyed checksum of (student name, mission, stars), like an HMAC.
   The key lives in this page, so it stops casual copying between students, not a determined forger. */
const CODE_KEY='wire-room|beat-eve|2026';
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const normName=n=>String(n||'').trim().toLowerCase().replace(/\s+/g,' ');
function checksum(s){let n=parseInt(sha256(CODE_KEY+'|'+s).slice(0,8),16),out='';for(let i=0;i<6;i++){out+=B32[n%32];n=Math.floor(n/32);}return out;}
const missionNo=id=>String(Object.keys(MISSIONS).indexOf(id)+1).padStart(2,'0');
function missionCode(name,id,stars){const no=missionNo(id);return `M${no}-${stars}-${checksum(normName(name)+'|'+no+'|'+stars)}`;}
function reportCode(name){const s=Object.keys(MISSIONS).map(id=>progress[id]||0).join('');return `R-${s}-${checksum(normName(name)+'|R|'+s)}`;}
function verifyCode(name,code){
  code=String(code||'').trim().toUpperCase().replace(/\s+/g,'');
  const ids=Object.keys(MISSIONS);
  let m=code.match(/^M(\d\d)-([0-3])-([0-9A-Z]{6})$/);
  if(m){
    const id=ids[+m[1]-1];
    if(!id) return {ok:false,text:'That mission number doesn’t exist.'};
    const ok=checksum(normName(name)+'|'+m[1]+'|'+m[2])===m[3];
    return {ok,text:ok?`Valid. Mission ${+m[1]}, ${MISSIONS[id].title}: ${m[2]} star${m[2]==='1'?'':'s'}.`:'Not valid for this name. Check the spelling of the name and the code.'};
  }
  m=code.match(/^R-([0-3]+)-([0-9A-Z]{6})$/);
  if(m){
    const ok=m[1].length===ids.length&&checksum(normName(name)+'|R|'+m[1])===m[2];
    if(!ok) return {ok,text:'Not valid for this name. Check the spelling of the name and the code.'};
    const total=[...m[1]].reduce((a,c)=>a+ +c,0), done=[...m[1]].filter(c=>c!=='0').length;
    return {ok,text:`Valid report card. ${done} of ${ids.length} missions complete, ${total} of ${ids.length*3} stars.`,
      detail:ids.map((id,i)=>`<li>${i+1}. ${MISSIONS[id].title}: ${m[1][i]}★</li>`).join('')};
  }
  return {ok:false,text:'That doesn’t look like a Beat Eve code. Mission codes look like M03-2-ABC123, report cards like R-3320…-ABC123.'};
}
async function copyText(text,el){
  try{await navigator.clipboard.writeText(text);toast('Copied.');}
  catch(e){if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);}toast('Copy isn’t available here. The code is selected, so press Ctrl+C (or ⌘C).');}
}
function codeBlock(id,stars){
  if(!studentName) return `<div class="codebox"><label class="lbl" for="nameIn">Your name, for your completion code</label>
    <div class="row"><input id="nameIn" class="inp" autocomplete="name" placeholder="First and last name"><button type="button" class="btn" id="nameSave">Get my code</button></div></div>`;
  const code=missionCode(studentName,id,stars);
  return `<div class="codebox"><span class="lbl">Completion code for ${esc(studentName)}</span>
    <div class="row"><code class="code" id="codeOut">${code}</code><button type="button" class="btn sm" id="codeCopy">Copy</button></div>
    <small class="muted">Paste this where your teacher asks. It’s tied to your name and this score.</small></div>`;
}
function wireCodeBlock(id,stars){
  const c=$('#modalCard'), save=$('#nameSave',c), inp=$('#nameIn',c);
  if(save){
    const go=()=>{if(!inp.value.trim()){inp.focus();return;}setName(inp.value);const box=$('.codebox',c);box.outerHTML=codeBlock(id,stars);wireCodeBlock(id,stars);SFX.play('coin');};
    save.onclick=go; inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};
  }
  const cp=$('#codeCopy',c); cp&&(cp.onclick=()=>copyText($('#codeOut',c).textContent,$('#codeOut',c)));
}

/* ---------- characters ---------- */
const NAMES={alice:'Alice',bob:'Bob',eve:'Eve',mallory:'Mallory',trent:'Trent'};
const CAST={
  alice:{tone:'var(--k-alice)',skin:'#E7B28C',hair:'#3A2317'},
  bob:{tone:'var(--k-bob)',skin:'#8A5536',hair:'#1D1310'},
  eve:{tone:'var(--eve)',skin:'#C98D69',hair:'#2A1C22'},
  mallory:{tone:'var(--k-mal)',skin:'#EFC6A4',hair:'#4A3A2C'},
  trent:{tone:'var(--k-ca)',skin:'#B97C56',hair:'#A9B0BA'},
};
let PID=0;
function portrait(who,cls='pt'){
  const c=CAST[who],id='pc'+(++PID),S=c.skin,Hc=c.hair,T=c.tone;
  const eyes=who==='mallory'?`<path d="M26 29.5h4M34 29.5h4" stroke="#1B1B22" stroke-width="1.8" stroke-linecap="round"/>`:`<circle cx="28" cy="29" r="1.5" fill="#1B1B22"/><circle cx="36" cy="29" r="1.5" fill="#1B1B22"/>`;
  const mouth=who==='eve'||who==='mallory'?`<path d="M28.5 35 Q33 37 36 34" fill="none" stroke="#6B3A2A" stroke-width="1.4" stroke-linecap="round"/>`:`<path d="M28.5 34.2 Q32 37 35.5 34.2" fill="none" stroke="#6B3A2A" stroke-width="1.4" stroke-linecap="round"/>`;
  let back='',front='',body=`<path d="M7 66C7 50 18 44 32 44S57 50 57 66Z" fill="${T}"/>`,extra='';
  if(who==='alice'){back=`<path d="M19 30C17 13 47 13 45 30L47 42C40 45 24 45 17 42Z" fill="${Hc}"/>`;front=`<path d="M20.5 25C23 13 42 12 44 25C38 19.5 28 19.5 20.5 25Z" fill="${Hc}"/>`;}
  if(who==='bob'){front=`<path d="M20.5 26C20 12 44 12 43.5 26C41 18.5 23 18.5 20.5 26Z" fill="${Hc}"/><path d="M21.5 31C23 43 41 43 42.5 31C39 38 25 38 21.5 31Z" fill="${Hc}"/>`;}
  if(who==='eve'){back=`<path d="M13 46C11 17 22 9 32 9S53 17 51 46Z" fill="${T}"/>`;extra=`<path d="M18.5 28C18.5 11 45.5 11 45.5 28" fill="none" stroke="#231B2B" stroke-width="3"/><rect x="15" y="24" width="6.5" height="11" rx="2.5" fill="#231B2B"/><rect x="42.5" y="24" width="6.5" height="11" rx="2.5" fill="#231B2B"/>`;front=`<path d="M21 23C24 16 40 16 43 23C37 20 27 20 21 23Z" fill="${Hc}"/>`;}
  if(who==='mallory'){extra=`<ellipse cx="32" cy="20" rx="19" ry="3.6" fill="#25252D"/><path d="M22.5 20C22 8 42 8 41.5 20Z" fill="#25252D"/><rect x="22.5" y="16.5" width="19" height="2.6" fill="${T}"/>`;body=`<path d="M7 66C7 50 18 44 32 44S57 50 57 66Z" fill="#4B4458"/><path d="M24 44L32 58L40 44L36 43L32 50L28 43Z" fill="${T}"/>`;}
  if(who==='trent'){front=`<path d="M20.5 27C19.5 15 44.5 15 43.5 27C42 22.5 39 21 36 21C33 18.8 28 19.2 25 21.5C23 22.5 21.5 24.5 20.5 27Z" fill="${Hc}"/>`;extra=`<circle cx="28" cy="29" r="3.4" fill="none" stroke="#2A3246" stroke-width="1.3"/><circle cx="36" cy="29" r="3.4" fill="none" stroke="#2A3246" stroke-width="1.3"/><path d="M31.4 29h1.2" stroke="#2A3246" stroke-width="1.3"/>`;body=`<path d="M7 66C7 50 18 44 32 44S57 50 57 66Z" fill="#2E3C58"/><path d="M26.5 44L32 55L37.5 44Z" fill="#EEF1F5"/><path d="M31 47h2l1.2 9-2.2 3-2.2-3Z" fill="${T}"/>`;}
  return `<svg class="${cls}" viewBox="0 0 64 64" role="img" aria-label="${NAMES[who]}"><defs><clipPath id="${id}"><circle cx="32" cy="32" r="31"/></clipPath></defs>
    <circle cx="32" cy="32" r="31" fill="${T}" fill-opacity=".18" stroke="${T}" stroke-width="2"/>
    <g clip-path="url(#${id})">${back}${body}<rect x="27" y="36" width="10" height="10" fill="${S}"/><ellipse cx="32" cy="28.5" rx="11" ry="12.5" fill="${S}"/>${eyes}${mouth}${front}${extra}</g></svg>`;
}

/* ---------- icons ---------- */
const ICON={
  star:on=>`<svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on?'var(--k-shared)':'none'}" stroke="${on?'var(--k-shared)':'var(--line)'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`,
  key:c=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="12" r="4.4" fill="none" stroke="${c}" stroke-width="2.6"/><path d="M11.4 12H22M18.5 12v4M21.5 12v3" fill="none" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/></svg>`,

/* =====================================================================
   COURIER ENGINE — missions 1, 2, 3, 9
   Items: messages, keys, hashes, and boxes (an item locked with a key).
   Anyone who holds the opening key for a box can see inside it.
   ===================================================================== */
const KEYDEF={
  S:{name:'Shared secret key',type:'sym',tone:'var(--k-shared)'},
  Bpub:{name:'Bob’s public key',type:'pub',pair:'Bpriv',tone:'var(--k-bob)'},
  Bpriv:{name:'Bob’s private key',type:'priv',pair:'Bpub',tone:'var(--k-bob)'},
  Apub:{name:'Alice’s public key',type:'pub',pair:'Apriv',tone:'var(--k-alice)'},
  Apriv:{name:'Alice’s private key',type:'priv',pair:'Apub',tone:'var(--k-alice)'},
  Mpub:{name:'Mallory’s public key',type:'pub',pair:'Mpriv',tone:'var(--k-mal)'},
  Mpriv:{name:'Mallory’s private key',type:'priv',pair:'Mpub',tone:'var(--k-mal)'},
};
const opener=k=>KEYDEF[k].type==='sym'?k:KEYDEF[k].pair;
let UID=0;
const mk=o=>Object.assign({uid:++UID},o);
const Msg=(label,big)=>mk({kind:'msg',label,big});
const Key=k=>mk({kind:'key',key:k});
const Hash=it=>mk({kind:'hash',of:it});
const Box=(lock,inner)=>mk({kind:'box',lock,inner});
const isBig=it=>it.kind==='msg'?it.big:it.kind==='box'?isBig(it.inner):false;

function reveal(received,keys){
  const K=new Set(keys),pool=[...received],opened=new Set();
  let changed=true;
  while(changed){
    changed=false;
    for(let i=0;i<pool.length;i++){
      const it=pool[i];
      if(it.kind==='key'&&!K.has(it.key)){K.add(it.key);changed=true;}
      if(it.kind==='box'&&!opened.has(it.uid)&&K.has(opener(it.lock))){opened.add(it.uid);pool.push(it.inner);changed=true;}
    }
  }
  return {pool,K,opened};
}
const hasMsg=v=>v.pool.some(i=>i.kind==='msg');
const hasSig=v=>v.pool.some(i=>i.kind==='box'&&i.lock==='Apriv'&&v.opened.has(i.uid)&&i.inner.kind==='hash'&&i.inner.of.kind==='msg');

const COURIER={

    takeaways:['<b>Symmetric encryption</b> uses one shared secret key to both encrypt and decrypt (AES, DES, IDEA, RC4).','It is fast and good for bulk data, which is why it protects the actual payload in real protocols.','Its weak spot is <b>key distribution</b>. If the key ever crosses the wire in the open, the attacker has it. This mission only worked because Bob got the key in person.']
  },
  m2:{
    story:'Bob is overseas. You’ve never met, so he doesn’t have any shared key. You do have Bob’s public key from his digital certificate. The project file is 2 GB.',

    takeaways:['<b>Hybrid key exchange</b> (slides 19–21): the sender encrypts the plaintext with a symmetric shared key, then encrypts that shared key with the <b>recipient’s public key</b>, and sends both.','The recipient decrypts the shared key with <b>their own private key</b>, then decrypts the ciphertext with the shared key.','Asymmetric encryption is slow, so it is used on small data such as keys. Symmetric handles the bulk.','Encrypting the file does not encrypt the key, and encrypting the key does not encrypt the file. You needed both locks.','The recipient’s private key never leaves the recipient.']
  },
  m3:{
    story:'Your press release is public, so it’s fine if Eve reads it. But Bob needs proof that it came from you and that nobody changed a word. That’s what a digital signature does.',

  const opts=shuffle([

  screen.innerHTML=shell('m9')+`<p class="story">${cfg.story}</p>

    <div class="card manual"><h4>Your trust store (root CAs)</h4><ul><li>Veridian Root CA</li><li>Polaris Global Root R2</li><li>Anchorline Root X1</li></ul></div>
  </div>
  <div class="picker">${opts.map((o,i)=>`<div class="cert" role="button" tabindex="0" data-i="${i}"><h4>Certificate ${i+1}</h4><dl>
    <dt>Subject</dt><dd>${o.cn}</dd><dt>Issued by</dt><dd><div class="chain">${o.issuer.map(x=>`<span>${x}</span>`).join('')}</div></dd>
    <dt>Valid</dt><dd>${o.valid}</dd><dt>Key</dt><dd>${o.fp}…</dd></dl></div>`).join('')}</div>`;
  wireHome();
  $$('.picker .cert',screen).forEach(el=>{

      const eve=['Bpub','Apub','Mpub'].concat(o.real?[]:['Mpriv']);
      runBench('m9',cfg,inv,eve,{labels:{Mpub:'Bob’s public key (from cert)',Bpub:'Bob’s public key (from cert)'},fake:!o.real,fakeWhy:o.why});
    };
    el.onclick=go; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};

function runBench(id,cfg,inv,eveKeys,opt){
  const villain=cfg.villain||'Eve';
  const st={inv,sel:null,sent:[],mistakes:0,busy:false,log:[],hint:0,over:false};
  const kname=k=>(opt.labels&&opt.labels[k])||KEYDEF[k].name;
  const short=it=>it.kind==='msg'?it.label:it.kind==='key'?kname(it.key):it.kind==='hash'?`hash of ${short(it.of)}`:`box locked with ${kname(it.lock)}`;
  const digest=it=>{let h=2166136261;const s=short(it.of)+it.of.uid;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return ('00000000'+(h>>>0).toString(16)).slice(-8)+'…';};
  const GOALTXT={conf:`Bob reads the file, ${villain} learns nothing`,read:'Bob receives the release',sig:'Bob can verify it’s from you'};

  function card(it,view,who){
    if(it.kind==='msg'){
      const leak=who==='eve'&&cfg.goals.includes('conf');
      return `<div class="it ${leak?'leak':''}">${ICON.doc()}<div>${leak?`<span class="leaktag">${villain.toUpperCase()} CAN READ THIS</span>`:''}<b>${esc(it.label)}</b><small>${it.big?'Large file':'Short note'}</small></div></div>`;
    }
    if(it.kind==='key'){
      const d=KEYDEF[it.key],leak=who==='eve'&&(d.type==='sym'||it.key==='Apriv');
      const tone=(opt.labels&&opt.labels[it.key])?'var(--k-bob)':d.tone;
      const badge=d.type==='priv'?'<span class="badge priv">PRIVATE</span>':d.type==='pub'?'<span class="badge pub">PUBLIC</span>':'<span class="badge sec">SECRET</span>';
      return `<div class="it key ${leak?'leak':''}" style="--kc:${tone}">${ICON.key(tone)}<div>${leak?`<span class="leaktag">${villain.toUpperCase()} HAS THIS KEY</span>`:''}<b>${esc(kname(it.key))}${badge}</b><small>${d.type==='sym'?'Locks and unlocks':d.type==='pub'?'Anyone may have this':'Must never leave its owner'}</small></div></div>`;
    }
    if(it.kind==='hash') return `<div class="it">${ICON.hash()}<div><b>Hash digest <span class="mono" style="font-weight:400">${digest(it)}</span></b><small>of ${esc(short(it.of))} · small, one-way</small></div></div>`;
    const tone=(opt.labels&&opt.labels[it.lock])?'var(--k-bob)':KEYDEF[it.lock].tone;
    const isOpen=who==='alice'||view.opened.has(it.uid);
    return `<div class="it box" style="--kc:${tone}"><div class="box-head">${ICON.lock(tone,isOpen&&who!=='alice')}<span>Locked with ${esc(kname(it.lock))}</span></div>
      ${isOpen?`<div class="box-in">${card(it.inner,view,who)}</div>`:`<div class="box-sealed">Can’t open. Needs ${esc(KEYDEF[opener(it.lock)].name)}.</div>`}</div>`;
  }

  function render(){
    const eve=reveal(st.sent,eveKeys),bob=reveal(st.sent,cfg.bob);
    const done={conf:hasMsg(bob)&&!hasMsg(eve)&&!eve.K.has('S'),read:hasMsg(bob),sig:hasSig(bob)};
    const sel=st.inv.find(i=>i.uid===st.sel);
    const keysOnDesk=st.inv.filter(i=>i.kind==='key'&&(!sel||i.uid!==sel.uid));
    screen.innerHTML=shell(id)+`<p class="story">${cfg.story}</p>
    <div class="goals">${cfg.goals.map(g=>`<span class="goal ${done[g]?'done':''}"><i></i>${GOALTXT[g]}</span>`).join('')}
      <button class="btn sm ghost" type="button" id="hintBtn">${st.hint<cfg.hints.length?'Hint':'No more hints'}</button>
      <button class="btn sm ghost" type="button" id="resetBtn">Start over</button></div>
    ${st.hint?`<div class="hintbox">${cfg.hints.slice(0,st.hint).map((h,i)=>`<div><b>Hint ${i+1}.</b> ${h}</div>`).join('')}</div>`:''}
    <div class="bench">
      <section class="panel" aria-label="Alice's desk"><h3>${portrait('alice')}Your desk (Alice)</h3>
        <div class="items">${st.inv.map(it=>`<div class="deskitem ${st.sel===it.uid?'sel':''}" role="button" tabindex="0" aria-pressed="${st.sel===it.uid}" data-uid="${it.uid}">${card(it,null,'alice')}${st.sent.includes(it)?'<span class="sentmark">Sent to Bob</span>':''}</div>`).join('')}</div>
        <div class="actions">${sel?`
          <div class="row"><span class="lbl">Lock it with</span>${keysOnDesk.length?keysOnDesk.map(k=>{const tone=(opt.labels&&opt.labels[k.key])?'var(--k-bob)':KEYDEF[k.key].tone;return `<button type="button" class="keybtn" style="--kc:${tone}" data-lock="${k.key}">${ICON.key(tone)}${esc(kname(k.key))}</button>`;}).join(''):'<span class="empty">no other keys</span>'}</div>
          <div class="row"><button type="button" class="btn" id="hashBtn">Hash it</button><button type="button" class="btn primary" id="sendBtn">Send to Bob →</button></div>`
          :'<span class="empty">Tap an item on your desk to lock it, hash it or send it.</span>'}</div>
      </section>
      <section class="panel" aria-label="The wire"><h3 class="evehead">${portrait(villain==='Mallory'?'mallory':'eve')}The wire · ${villain}’s notebook</h3>
        <div class="pipe" id="pipe"><div class="line"></div><div class="endA" style="--c:var(--k-alice)"></div><div class="endB" style="--c:var(--k-bob)"></div><div class="tap"></div>${ICON.eve()}</div>
        <div class="items">${st.sent.length?st.sent.map(it=>card(it,eve,'eve')).join(''):`<span class="empty">${villain} has copied nothing yet.</span>`}</div>
      </section>
      <section class="panel" aria-label="Bob's inbox"><h3>${portrait('bob')}Bob’s inbox</h3>
        <div class="items">${st.sent.length?st.sent.map(it=>card(it,bob,'bob')).join(''):'<span class="empty">Nothing received yet.</span>'}</div>
      </section>
    </div>
    <div class="log" aria-label="Activity log">${st.log.slice().reverse().map(l=>`<div>${esc(l)}</div>`).join('')}</div>`;
    wireHome();
    $('#hintBtn').onclick=()=>{if(st.hint<cfg.hints.length){st.hint++;render();}};
    $('#resetBtn').onclick=()=>runBench(id,cfg,id==='m9'?[Msg('Merger plan (1 GB)',true),Key('S'),Key(opt.fake?'Mpub':'Bpub'),Key('Apriv')]:cfg.inv(),eveKeys,opt);
    $$('.deskitem',screen).forEach(el=>{
      const f=()=>{if(st.busy)return;SFX.play('click');st.sel=st.sel===+el.dataset.uid?null:+el.dataset.uid;render();const again=$(`.deskitem[data-uid="${el.dataset.uid}"]`);again&&again.focus();};
      el.onclick=f; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}};
    });
    $$('[data-lock]',screen).forEach(b=>b.onclick=()=>lock(sel,b.dataset.lock));
    const hb=$('#hashBtn'); hb&&(hb.onclick=()=>hash(sel));
    const sb=$('#sendBtn'); sb&&(sb.onclick=()=>send(sel));
  }
  function lock(it,k){
    if(st.busy)return;
    const d=KEYDEF[k];
    if(d.type!=='sym'&&isBig(it)){
      st.mistakes++; SFX.play('bad');
      toast(`<b>Too big for ${esc(kname(k))}.</b> Asymmetric encryption is slow and meant for small data like keys or hashes. Use the fast symmetric key for large files.`);
      return;
    }
    if(it.kind==='key'&&KEYDEF[it.key].type==='priv'){
      st.mistakes++; SFX.play('bad');
      toast('<b>Leave your private key alone.</b> It never gets packaged up or sent anywhere, even locked.');
      return;
    }
    const b=Box(k,it); st.inv.push(b); st.sel=b.uid; SFX.play('lock');
    st.log.push(`You locked “${short(it)}” with ${kname(k)}.`);
    render();
  }
  function hash(it){
    if(st.busy)return;
    if(it.kind==='hash'){toast('It’s already a digest. Hashing again doesn’t help here.');return;}
    const h=Hash(it); st.inv.push(h); st.sel=h.uid; SFX.play('hash');
    st.log.push(`You hashed “${short(it)}”. The digest is small and one-way.`);
    render();
  }
  function send(it){
    if(st.busy||st.over)return;
    if(it.kind==='key'&&KEYDEF[it.key].type==='priv'){
      st.over=true;
      return failMission(id,'You sent a private key',`<p>${esc(kname(it.key))} went out over the wire, and ${villain} copied it. Anyone holding it can now sign as you and open anything locked with your public key.</p><p><b>Rule:</b> a private key is kept secret and is never shared with anyone, including the person you trust.</p>`);
    }
    if(st.sent.includes(it)){toast('Bob already has that one.');return;}
    st.busy=true; SFX.play('send');
    const pipe=$('#pipe'),p=document.createElement('div');
    p.className='packet'; pipe.appendChild(p);
    const bug=$('.evebug',pipe); setTimeout(()=>bug&&bug.classList.add('flash'),420);
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(()=>{
      st.busy=false; st.sent.push(it); st.sel=null;
      st.log.push(`Sent “${short(it)}”. ${villain} copied it.`);
      render(); evaluate(it);
    },reduce?50:960);
  }
  function evaluate(last){
    const eve=reveal(st.sent,eveKeys),bob=reveal(st.sent,cfg.bob);
    const conf=cfg.goals.includes('conf');
    if(opt.fake&&st.sent.some(i=>i.kind==='box'&&i.lock==='Mpub')){
      st.over=true;
      return failMission(id,'Mallory swapped the key',`<p>The certificate you picked was ${opt.fakeWhy==='self'?'<b>self-signed</b>: nobody but “Bob” vouched for it':'issued by <b>ShadyTrust</b>, a CA that isn’t in your trust store'}. The key inside belonged to Mallory.</p><p>She opened your box, copied what was inside, re-locked it with Bob’s real public key and passed it on. Bob noticed nothing. This is a <b>man-in-the-middle attack</b>.</p><p>Choose the certificate whose chain ends at a root in your trust store.</p>`);
    }
    if(eve.pool.some(i=>i.kind==='key'&&i.key==='Apriv')||bob.pool.some(i=>i.kind==='key'&&i.key==='Apriv')){
      st.over=true;
      return failMission(id,'Your private key left the building','<p>Private keys are never shared with anyone, not even Bob.</p>');
    }
    if(conf&&eve.K.has('S')){
      st.over=true;
      return failMission(id,`${villain} has the shared key`,`<p>The Shared secret key crossed the wire where ${villain} could open it. Anything locked with it is now readable to ${villain}, past and future.</p><p>This is the core problem with symmetric encryption: <b>secure distribution of the key</b>. ${id==='m1'?'Bob already had the key. There was no reason to send it.':'Protect the key itself by locking it with Bob’s public key.'}</p>`);
    }
    if(conf&&hasMsg(eve)){
      st.over=true;
      return failMission(id,`${villain} read your file`,`<p>“${esc(COURIER_MSG(st))}” reached ${villain} in a form ${villain} could read. Lock it before it goes on the wire.</p>`);
    }
    if(last.kind==='box'&&last.lock==='Apub'){SFX.play('bad');} if(last.kind==='box'&&last.lock==='Apub') toast('Only <b>your private key</b> opens a box locked with your public key, so Bob can’t open it. To prove something came from you, lock it with your <b>private</b> key.',6000);
    if(last.kind==='box'&&last.lock==='Apriv'&&last.inner.kind!=='hash') toast('Anyone with your public key can open that box, so it isn’t secret.',5000);
    const ok={conf:hasMsg(bob)&&!hasMsg(eve),read:hasMsg(bob),sig:hasSig(bob)};
    if(cfg.goals.every(g=>ok[g])){
      st.over=true;
      const stars=st.mistakes===0&&st.hint<=1?3:st.mistakes<=2&&st.hint<=2?2:1;
      const n=st.sent.length;
      const verify=cfg.goals.includes('sig')?`<p class="eq">Bob: decrypt signature with Alice’s public key → digest ${'✓'}<br>Bob: hash the file himself → same digest ✓<br>Match. The file is unchanged and came from Alice.</p>`:'';
      setTimeout(()=>endMission(id,stars,id==='m9'?'Mallory beaten':'Delivered',cfg.takeaways,`<p>${n} item${n>1?'s':''} sent, ${st.mistakes} mistake${st.mistakes===1?'':'s'}, ${st.hint} hint${st.hint===1?'':'s'}.</p>${verify}`),350);
    }
  }
  const COURIER_MSG=s=>s.inv.find(i=>i.kind==='msg').label;
  render();
}

/* =====================================================================
   MISSION 4 — PAINT LAB (Diffie-Hellman color analogy)
   ===================================================================== */
function paintLab(){
  const COMMON={name:'Sun yellow',rgb:[238,198,52]};
  const SECRETS=[{name:'Crimson',rgb:[196,26,60]},{name:'Cobalt',rgb:[28,72,204]},{name:'Teal',rgb:[0,150,140]},{name:'Plum',rgb:[122,38,142]},{name:'Forest',rgb:[30,112,52]}];
  const mix=(...cs)=>[0,1,2].map(i=>Math.round(cs.reduce((a,c)=>a+c[i],0)/cs.length));
  const css=c=>`rgb(${c.join(',')})`;
  const st={step:1,a:null,b:null,mistakes:0,evePot:[],eveTries:0};
  function pot(c,label,sub){return `<div class="pot"><div class="blob" style="background:${css(c)}"></div><b>${label}</b>${sub?`<small class="muted">${sub}</small>`:''}</div>`;}
  function render(){
    const A=st.a&&mix(COMMON.rgb,st.a.rgb), B=st.b&&mix(COMMON.rgb,st.b.rgb);
    const shared=st.a&&st.b&&mix(COMMON.rgb,st.a.rgb,st.b.rgb);
    let body='';
    if(st.step===1){
      body=`<div class="card"><h3>1. Pick your secret paint</h3><p>Everyone, Eve included, knows the public starter paint: <b>${COMMON.name}</b>. Your secret color never leaves your room.</p>
      <div class="swrow">${SECRETS.map((s,i)=>`<button type="button" class="swatch" style="background:${css(s.rgb)}" data-s="${i}" aria-label="${s.name}"><span>${s.name}</span></button>`).join('')}</div></div>`;
    }else if(st.step===2){
      body=`<div class="two"><div class="card"><h3>2. Mix and send</h3><p>You mixed your secret into the public yellow. Mixing is easy. Unmixing is practically impossible. That’s what makes this safe to send.</p>
        <div class="pots">${pot(COMMON.rgb,'Public yellow')}${pot(st.a.rgb,'Your secret','stays home')}${pot(A,'Your public mix','goes on the wire')}</div>
        <button type="button" class="btn primary" id="sendMix">Send my mix to Bob →</button></div>
        <div class="card"><h3>Bob is doing the same</h3><p class="muted">He picked his own secret paint and mixed it with the same public yellow. You’ll never see his secret.</p></div></div>`;
    }else if(st.step===3){
      body=`<div class="two"><div class="card"><h3>3. Bob’s mix arrived</h3><p>Eve saw it go by, just like she saw yours. What do you add to <b>Bob’s mix</b> to make the shared secret?</p>
        <div class="pots">${pot(B,'Bob’s public mix','from the wire')}</div>
        <div class="choices"><button type="button" class="btn" data-add="secret">Add my secret paint</button><button type="button" class="btn" data-add="common">Add more public yellow</button><button type="button" class="btn" data-add="mix">Add my public mix</button></div></div>
        <div class="card"><h3>On the wire</h3><div class="pots">${pot(COMMON.rgb,'Public yellow')}${pot(A,'Your mix')}${pot(B,'Bob’s mix')}</div><p class="muted" style="margin:0">Eve has all three of these.</p></div></div>`;
    }else if(st.step===4){
      const evec=st.evePot.length?mix(...st.evePot):null;
      const dist=evec?Math.hypot(...evec.map((v,i)=>v-shared[i])):null;
      const match=evec?Math.min(99,Math.max(0,Math.round(100-dist/1.6))):0;
      body=`<div class="two"><div class="card"><h3>Same color, never sent</h3><p>You added your secret to Bob’s mix. Bob added his secret to yours. Both pots hold yellow + your secret + Bob’s secret.</p>
        <div class="pots">${pot(shared,'Your result')}${pot(shared,'Bob’s result')}</div><p class="eq">yellow + mine + Bob’s = yellow + Bob’s + mine</p></div>
        <div class="card"><h3>Now you’re Eve</h3><p>You have the public yellow and both public mixes. Pour cups into your pot and try to match the shared color exactly.</p>
          <div class="pots">${pot(shared,'Target','the shared secret')}${evec?pot(evec,'Eve’s pot',`${st.evePot.length} cup${st.evePot.length>1?'s':''} · ${match}% match`):`<div class="pot"><div class="blob" style="background:var(--panel2)"></div><b>Eve’s pot</b><small class="muted">empty</small></div>`}</div>
          <div class="choices"><button type="button" class="btn sm" data-eve="c">+ public yellow</button><button type="button" class="btn sm" data-eve="a">+ Alice’s mix</button><button type="button" class="btn sm" data-eve="b">+ Bob’s mix</button><button type="button" class="btn sm ghost" data-eve="x">Empty pot</button></div>
          <p class="muted" style="font-size:14px">Every cup Eve owns already has yellow in it, so her pot always has too much yellow. Close isn’t good enough: a key has to match exactly.</p>
          <button type="button" class="btn primary" id="finish" ${st.eveTries>=3?'':'disabled'}>${st.eveTries>=3?'Finish mission':`Pour ${3-st.eveTries} more cup${3-st.eveTries>1?'s':''} to finish`}</button></div></div>`;
    }
    screen.innerHTML=shell('m4')+`<p class="story">You and Bob need the same secret color, but every can of paint you send, Eve copies. This is the idea behind <b>Diffie-Hellman key agreement</b>.</p>`+body;
    wireHome();
    $$('[data-s]',screen).forEach(b=>b.onclick=()=>{SFX.play('pour');st.a=SECRETS[+b.dataset.s];st.b=pick(SECRETS.filter(s=>s!==st.a));st.step=2;render();});
    const sm=$('#sendMix'); sm&&(sm.onclick=()=>{SFX.play('send');st.step=3;render();});
    $$('[data-add]',screen).forEach(b=>b.onclick=()=>{
      const v=b.dataset.add;
      if(v==='secret'){SFX.play('good');st.step=4;render();return;}
      st.mistakes++; SFX.play('bad');
      toast(v==='common'?'Extra public yellow is something Eve could add too. Only your <b>secret</b> gives you something Eve doesn’t have.':'Your public mix is on the wire, so Eve has it too. Add something only <b>you</b> have.');
    });
    $$('[data-eve]',screen).forEach(b=>b.onclick=()=>{
      const v=b.dataset.eve;
      SFX.play('pour');
      if(v==='x'){st.evePot=[];}else{st.evePot.push(v==='c'?COMMON.rgb:v==='a'?mix(COMMON.rgb,st.a.rgb):mix(COMMON.rgb,st.b.rgb));st.eveTries++;}
      render();
    });
    const fin=$('#finish'); fin&&(fin.onclick=()=>endMission('m4',st.mistakes===0?3:st.mistakes===1?2:1,'Key agreed',[
      'In <b>Diffie-Hellman</b> both sides compute the same secret. The secret itself is never sent, so there’s nothing on the wire to steal.',
      'The starter value and both mixes are public. Security comes from the fact that mixing is easy and unmixing is hard. The next mission shows the real math behind “unmixing”.',
      'This is <b>key agreement</b>, not key exchange. Slide 22 calls it out: with PFS, keys are never exchanged. The stations agree on a key value.']));
  }
  render();
}

/* =====================================================================
   MISSION 5 — CLOCK MATH (DH with modular arithmetic)
   ===================================================================== */
function clockMath(){
  const p=23,g=5;
  const powmod=(b,e,m)=>{let r=1;b%=m;while(e>0){if(e&1)r=r*b%m;b=b*b%m;e>>=1;}return r;};
  const st={phase:1,v:1,n:0,A:null,b:rnd(3,19),B:null,v2:1,k:0,mistakes:0,eveA:null,eveV:1,eveN:0,eveStart:0,eveTime:null,bits:2048,hist:[]};
  st.B=powmod(g,st.b,p);
  let timer=null;
  function clock(val,mult,label){
    const R=120,cx=150,cy=150;
    const ticks=[...Array(p).keys()].map(i=>{const a=i/p*2*Math.PI-Math.PI/2,x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R,tx=cx+Math.cos(a)*(R+17),ty=cy+Math.sin(a)*(R+17);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i===val?9:3.5}" fill="${i===val?'var(--accent)':'var(--line)'}"/><text x="${tx.toFixed(1)}" y="${(ty+4).toFixed(1)}" text-anchor="middle" font-size="11" font-family="JetBrains Mono, monospace" fill="${i===val?'var(--accent)':'var(--muted)'}" font-weight="${i===val?700:400}">${i}</text>`;}).join('');
    const a=val/p*2*Math.PI-Math.PI/2;
    return `<svg class="clock" viewBox="0 0 300 300" role="img" aria-label="Mod ${p} dial pointing at ${val}"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-width="2"/>${ticks}
      <line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(a)*(R-16)).toFixed(1)}" y2="${(cy+Math.sin(a)*(R-16)).toFixed(1)}" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="6" fill="var(--accent)"/></svg>`;
  }
  const stepLine=(prev,m)=>`${prev} × ${m} = ${prev*m} → ${prev*m} mod ${p} = ${(prev*m)%p}`;
  function render(){
    let body='';
    if(st.phase===1){
      body=`<div class="card"><h3>1. Turn the dial to make your secret</h3>
      <p>Public numbers everyone knows: <b>p = ${p}</b> (the dial has ${p} positions, 0 to 22) and <b>g = ${g}</b>. Start at 1. Each turn multiplies by ${g} and wraps around the dial. How many times you turn is <b>your secret</b>. Turn it 3 to 20 times.</p>
      <div class="clockwrap">${clock(st.v,g,'your dial')}<div>
        <p class="lbl">Turns so far (secret)</p><div class="bigval">${st.n}</div>
        <p class="lbl" style="margin-top:12px">Dial shows</p><div class="bigval">${st.v}</div>
        <div class="eq" style="margin-top:12px">${st.hist.length?esc(st.hist[st.hist.length-1]):'Start: 1'}</div>
        <div class="choices"><button type="button" class="btn" id="turn">Turn × ${g}</button><button type="button" class="btn primary" id="lockin" ${st.n>=3&&st.n<=20?'':'disabled'}>Send ${st.v} to Bob</button></div></div></div></div>`;
    }else if(st.phase===2){
      body=`<div class="two"><div class="card"><h3>2. Build the shared key</h3>
        <p>You sent <b>A = ${st.A}</b>. Bob sent back <b>B = ${st.B}</b>. Eve saw both.</p>
        <p>Now start at 1 again and multiply by <b>Bob’s ${st.B}</b> exactly as many times as your secret: <b>${st.n}</b>.</p>
        <div class="clockwrap">${clock(st.v2,st.B,'shared-key dial')}<div><p class="lbl">Turns</p><div class="bigval">${st.k} / ${st.n}</div>
        <div class="eq" style="margin-top:12px">${st.hist.length?esc(st.hist[st.hist.length-1]):'Start: 1'}</div>
        <div class="choices"><button type="button" class="btn" id="turn2">Turn × ${st.B}</button><button type="button" class="btn primary" id="lock2" ${st.k?'':'disabled'}>Lock in ${st.v2}</button></div></div></div></div>
        <div class="card"><h3>What each person knows</h3><div class="eq">Public: p = ${p}, g = ${g}<br>You sent: A = ${g}<sup>${st.n}</sup> mod ${p} = ${st.A}<br>Bob sent: B = ${g}<sup>b</sup> mod ${p} = ${st.B}<br><br>Your secret: ${st.n}<br>Bob’s secret: hidden<br>Eve knows: p, g, A, B</div></div></div>`;
    }else if(st.phase===3){
      const t=st.eveTime!=null?st.eveTime:((performance.now()-st.eveStart)/1000);
      body=`<div class="two"><div class="card"><h3>3. Switch sides. You’re Eve.</h3>
        <p>A new Alice sent <b>A = ${st.eveA}</b> using the same p = ${p}, g = ${g}. Find her secret number of turns. Turn the dial until it lands on ${st.eveA}, then call it.</p>
        <div class="clockwrap">${clock(st.eveV,g,'Eve’s brute force')}<div><p class="lbl">Guess (turns)</p><div class="bigval">${st.eveN}</div><p class="lbl" style="margin-top:12px">Time</p><div class="bigval mono" id="eveClock">${t.toFixed(1)}s</div>
        <div class="choices"><button type="button" class="btn" id="eturn">Turn × ${g}</button><button type="button" class="btn primary" id="ecall">It’s ${st.eveN}!</button></div></div></div></div>
        <div class="card"><h3>Why real Eve loses</h3><p>With a ${p}-position dial, trying every turn count takes seconds. Real Diffie-Hellman uses a prime <b>p</b> that is thousands of bits long. Pick a key length:</p>
          <div class="choices">${[16,32,64,128,256,2048].map(b=>`<button type="button" class="btn sm ${st.bits===b?'primary':''}" data-bits="${b}">${b}-bit</button>`).join('')}</div>
          <p class="eq" style="margin-top:12px">${bruteText(st.bits)}</p>
          <p class="muted" style="font-size:14px;margin:0">Real attacks use smarter math than plain guessing, which is why DH groups need 2048 bits or more while ECDHE gets the same strength from about 256 bits. Either way, the lesson from slide 9 holds: longer keys, fewer successful attacks.</p></div></div>`;
    }
    screen.innerHTML=shell('m5')+`<p class="story">Real Diffie-Hellman replaces paint with <b>modular arithmetic</b>: clock math, where numbers wrap around after p. Going forward around the dial is easy. Working backward from where it stopped to how many turns it took is the hard problem (the discrete logarithm).</p>`+body;
    wireHome();
    const tu=$('#turn'); tu&&(tu.onclick=()=>{SFX.play('turn');if(st.n>=22){toast('That’s a full lap. 22 turns brings the dial back to 1.');}st.hist.push(stepLine(st.v,g));st.v=st.v*g%p;st.n++;render();});
    const li=$('#lockin'); li&&(li.onclick=()=>{SFX.play('send');while(st.b===st.n){st.b=rnd(3,19);}st.B=powmod(g,st.b,p);st.A=st.v;st.phase=2;st.hist=[];render();});
    const t2=$('#turn2'); t2&&(t2.onclick=()=>{SFX.play('turn');st.hist.push(stepLine(st.v2,st.B));st.v2=st.v2*st.B%p;st.k++;render();});
    const l2=$('#lock2'); l2&&(l2.onclick=()=>{
      const bobKey=powmod(st.A,st.b,p);
      if(st.k!==st.n||st.v2!==bobKey){
        st.mistakes++; SFX.play('bad');
        toast(`Your dial says ${st.v2}, Bob’s says ${bobKey}. You need exactly ${st.n} turns of × ${st.B}, the same count as your secret. Try again.`,6000);
        st.v2=1;st.k=0;st.hist=[];render();return;
      }
      SFX.play('good');
      modal({title:`Both got ${bobKey}`,tone:'win',html:`<p class="eq">You: B<sup>a</sup> mod p = ${st.B}<sup>${st.n}</sup> mod ${p} = ${st.v2}<br>Bob: A<sup>b</sup> mod p = ${st.A}<sup>${st.b}</sup> mod ${p} = ${bobKey}</p><p>Both equal g<sup>ab</sup> mod p. The shared key ${bobKey} was never sent. Bob’s secret was ${st.b}.</p><p>Next: be Eve and try to crack one.</p>`,
        actions:[{label:'Play Eve',primary:true,fn:()=>{st.phase=3;st.eveA=powmod(g,rnd(4,20),p);st.eveStart=performance.now();render();startTick();}}]});
    });
    const et=$('#eturn'); et&&(et.onclick=()=>{SFX.play('turn');st.eveV=st.eveV*g%p;st.eveN++;render();});
    const ec=$('#ecall'); ec&&(ec.onclick=()=>{
      if(st.eveV!==st.eveA){st.mistakes++;SFX.play('bad');toast(`The dial shows ${st.eveV}, not ${st.eveA}. Keep turning.`);return;}
      st.eveTime=(performance.now()-st.eveStart)/1000; stopTick(); render();
      const stars=st.mistakes===0?3:st.mistakes<=2?2:1;
      endMission('m5',stars,'Cracked, on a tiny dial',[
        'Both sides publish <b>A = g<sup>a</sup> mod p</b> and <b>B = g<sup>b</sup> mod p</b>. Each raises the other’s value to their own secret, so both get <b>g<sup>ab</sup> mod p</b>.',
        '<b>g</b>, <b>p</b>, <b>A</b> and <b>B</b> are all public. Recovering a secret exponent from A is the <b>discrete logarithm problem</b>.',
        `You cracked a ${p}-position dial in ${st.eveTime.toFixed(1)} seconds. Real groups use primes of 2048+ bits (or elliptic curves with ECDHE), where the same search would outlast the universe.`,
        '<b>Key length matters</b> (slide 9): each added bit doubles the brute-force work.'],
        `<p>Eve found the secret ${st.eveN} in ${st.eveTime.toFixed(1)} s.</p>`);
    });
    $$('[data-bits]',screen).forEach(b=>b.onclick=()=>{st.bits=+b.dataset.bits;render();});
  }
  function bruteText(bits){
    const log10Guesses=bits*Math.log10(2), log10Rate=12; // a trillion guesses per second
    const log10Sec=log10Guesses-log10Rate;
    let t;
    if(log10Sec<0) t='less than a second';
    else if(log10Sec<Math.log10(3600)) t=`${Math.round(10**log10Sec)} seconds`;
    else if(log10Sec<Math.log10(86400*365)) t=`${Math.round(10**log10Sec/3600)} hours`;
    else{const y=log10Sec-Math.log10(31557600); t=y<6?`${Math.round(10**y).toLocaleString()} years`:`about 10<sup>${Math.round(y)}</sup> years (the universe is about 10<sup>10</sup> years old)`;}
    return `${bits}-bit: about 10<sup>${Math.round(log10Guesses)}</sup> possible secrets.<br>At a trillion guesses per second: ${t}.`;
  }
  function startTick(){stopTick();timer=setInterval(()=>{const el=$('#eveClock');if(el&&st.eveTime==null)el.textContent=((performance.now()-st.eveStart)/1000).toFixed(1)+'s';},100);}
  function stopTick(){if(timer){clearInterval(timer);timer=null;}}
  cleanup=stopTick;
  render();
}

/* =====================================================================
   MISSION 6 — BREACH DAY (perfect forward secrecy)
   ===================================================================== */
function breachDay(){
  const DAYS=[['Mon','Customer login'],['Tue','Payroll upload'],['Wed','Medical record'],['Thu','Password reset']];
  const st={phase:'rsa',run:0,shred:[false,false,false,false],pending:null,breached:false,quizScore:0};
  let tick=null;
  function sessCard(i){
    const [d,what]=DAYS[i]; let cls='',status='Not run yet';
    if(i<st.run){
      if(st.phase==='rsa'){status=st.breached?'Session key unlocked with stolen server key. EXPOSED.':'Session key sent locked with server’s long-term public key. Eve recorded it.';cls=st.breached?'exposed':'';}
      else{const s=st.shred[i];status=st.breached?(s?'Ephemeral key was destroyed. SAFE.':'Ephemeral key was still in memory. EXPOSED.'):(s?'Ephemeral key destroyed.':'Ephemeral key still in memory!');cls=st.breached?(s?'safe':'exposed'):'';}
    }
    const pending=st.pending&&st.pending.i===i;
    return `<div class="sess ${cls}"><span class="lbl">${d}</span><b>${what}</b><span class="st">${status}</span>
      ${pending?`<div class="timerbar"><i id="shredBar"></i></div><button type="button" class="btn primary sm" id="shred">Destroy ephemeral key</button>`:''}</div>`;
  }
  function render(){
    let intro,controls;
    if(st.phase==='rsa'){
      intro=`<div class="card" style="margin-bottom:14px"><h3>Round 1: static key exchange</h3><p style="margin:0">Your server uses one long-term RSA key pair for every session. Each session key is sent locked with the server’s public key (just like mission 2). Eve can’t open it, so she records it and waits.</p></div>`;
      controls=st.run<4?`<button type="button" class="btn primary" id="runS">Run ${DAYS[st.run][0]} session</button>`:!st.breached?`<button type="button" class="btn primary" id="breach" style="background:var(--bad);border-color:var(--bad)">Friday: the server is breached</button>`:`<button type="button" class="btn primary" id="toDhe">Replay the week with DHE →</button>`;
    }else if(st.phase==='dhe'){
      intro=`<div class="card" style="margin-bottom:14px"><h3>Round 2: ephemeral Diffie-Hellman (DHE)</h3><p style="margin:0">Now each session agrees on a <b>brand-new key</b> with Diffie-Hellman, as in missions 4 and 5. Nothing secret is sent. When the session ends, destroy the ephemeral key before the timer runs out. Keys are short-lived and expire.</p></div>`;
      controls=st.pending?'<span class="muted">Destroy the key before the timer runs out.</span>':st.run<4?`<button type="button" class="btn primary" id="runS">Run ${DAYS[st.run][0]} session</button>`:!st.breached?`<button type="button" class="btn primary" id="breach" style="background:var(--bad);border-color:var(--bad)">Friday: the server is breached</button>`:`<button type="button" class="btn primary" id="toQuiz">Debrief →</button>`;
    }
    if(st.phase==='quiz') return quiz();
    screen.innerHTML=shell('m6')+`<p class="story">Eve can’t break your encryption today, so she records all of it and waits. On Friday she steals your server’s long-term private key. What can she read?</p>${intro}
      <div class="sessions">${DAYS.map((_,i)=>sessCard(i)).join('')}</div><div class="choices" style="margin-top:14px">${controls}</div>`;
    wireHome();
    const rs=$('#runS'); rs&&(rs.onclick=runSession);
    const br=$('#breach'); br&&(br.onclick=()=>{st.breached=true;SFX.play('alarm');render();
      const lost=st.phase==='rsa'?4:st.shred.filter(s=>!s).length;
      toast(st.phase==='rsa'?'<b>All four recorded sessions just opened.</b> One stolen key unlocked every session key it ever protected.':lost?`${lost} session${lost>1?'s':''} exposed because the ephemeral key was never destroyed.`:'<b>Nothing exposed.</b> The stolen key was never used to protect any session key.',6000);});
    const td=$('#toDhe'); td&&(td.onclick=()=>{st.phase='dhe';st.run=0;st.breached=false;st.shred=[false,false,false,false];render();});
    const tq=$('#toQuiz'); tq&&(tq.onclick=()=>{st.phase='quiz';render();});
    const sh=$('#shred'); sh&&(sh.onclick=()=>{SFX.play('good');const i=st.pending.i;st.shred[i]=true;clearT();st.pending=null;st.run=i+1;render();});
  }
  function runSession(){
    SFX.play('send');
    if(st.phase==='rsa'){st.run++;render();return;}
    const i=st.run,dur=rnd(2600,3600),t0=performance.now();
    st.pending={i}; st.run=i+1; render();
    clearT();
    tick=setInterval(()=>{
      const left=1-(performance.now()-t0)/dur, bar=$('#shredBar');
      if(bar) bar.style.width=Math.max(0,left*100)+'%';
      if(left<=0){clearT();st.pending=null;SFX.play('bad');render();toast('Too slow. That key is still sitting in memory.');}
    },50);
  }
  function clearT(){if(tick){clearInterval(tick);tick=null;}}
  cleanup=clearT;
  function quiz(){
    const Q=[
      {q:'Eve records today’s DHE traffic. Next year she steals the server’s private key. What can she decrypt from today?',o:['Nothing. Today’s session keys were ephemeral and are gone.','Everything she recorded.','Only the first session of the day.'],a:0,e:'The long-term key never protected the session keys, so stealing it later reveals nothing from the past. That is perfect forward secrecy.'},
      {q:'What does the E in DHE and ECDHE stand for?',o:['Encrypted','Ephemeral','Exchange','Elliptic'],a:1,e:'Ephemeral: a new, unique key value generated for each session, short-lived, then discarded. (The EC in ECDHE is Elliptic Curve.)'},
      {q:'With PFS key agreement, how does each side get the session key?',o:['The server sends it locked with its public key.','A certificate authority hands it out.','Each side computes it from values they exchanged. The key itself never crosses the wire.'],a:2,e:'Slide 22: keys are never exchanged. The two stations agree on a key value.'},
      {q:'Why is plain (static) RSA key exchange considered deprecated?',o:['Compromise of one long-term private key exposes every recorded session.','RSA can’t encrypt keys.','It needs a shared key in advance.'],a:0,e:'That is exactly what Round 1 showed you: one stolen key, four exposed sessions.'},
    ];
    const kept=st.shred.filter(Boolean).length;
    renderQuiz(shell('m6')+`<p class="story">Debrief. You kept ${kept} of 4 DHE sessions safe. Four quick questions.</p>`,Q,score=>{
      const stars=1+(kept===4?1:0)+(score>=3?1:0);
      endMission('m6',stars,'Forward secrecy',[
        '<b>Static key exchange</b> protects every session key with one long-term key. Steal that key later and every recorded session opens. That risk is why it’s deprecated.',
        '<b>Perfect forward secrecy</b> uses key agreement: a new, unique, <b>ephemeral</b> key each session that is short-lived and useless once it expires.',
        'Know the names: <b>DHE</b> (Diffie-Hellman Ephemeral) and <b>ECDHE</b> (Elliptic Curve DHE).',
        'Ephemeral only helps if keys really are destroyed. A key left in memory is a key that can be stolen.'],
        `<p>Sessions kept safe: ${kept}/4 · Quiz: ${score}/4</p>`);
    });
  }
  render();
}

/* ---------- shared quiz ---------- */
function renderQuiz(head,Q,done){
  let i=0,score=0;
  function draw(){
    const q=Q[i];
    screen.innerHTML=head+`<div class="card qwrap"><p class="lbl">Question ${i+1} of ${Q.length}</p><div class="q"><h3>${q.q}</h3><div class="opts">${q.o.map((o,j)=>`<button type="button" class="opt" data-j="${j}">${o}</button>`).join('')}</div><div id="qex"></div></div></div>`;
    wireHome();
    let answered=false;
    $$('.opt',screen).forEach(b=>b.onclick=()=>{
      if(answered)return; answered=true;
      const j=+b.dataset.j, right=j===q.a; if(right)score++; SFX.play(right?'good':'bad');
      b.classList.add(right?'right':'wrong'); $$('.opt',screen)[q.a].classList.add('right');
      $('#qex').innerHTML=`<div class="explain"><b>${right?'Correct.':'Not quite.'}</b> ${q.e}</div><div class="choices"><button type="button" class="btn primary" id="qnext">${i+1<Q.length?'Next question':'Finish'}</button></div>`;
      $('#qnext').onclick=()=>{i++; if(i<Q.length)draw(); else done(score);};
      $('#qnext').focus();

  }
  draw();
}


/* ---------- shared: tap-in-order ---------- */
function renderOrder(head,R,done,nextLabel){
  const order=shuffle(R.steps.map((x,i)=>i)); let placed=0,mistakes=0;
  function draw(){
    screen.innerHTML=head+`<div class="card qwrap"><h3>${R.title}</h3><p>${R.sub}</p><div class="steps">${order.map(i=>`<button type="button" class="step ${i<placed?'placed':''}" data-i="${i}"><span class="n">${i<placed?i+1:'?'}</span><span>${R.steps[i]}</span></button>`).join('')}</div>
      ${placed===R.steps.length?`<div class="explain">${R.why}</div><div class="choices"><button type="button" class="btn primary" id="nextR">${nextLabel||'Continue'}</button></div>`:''}</div>`;
    wireHome();
    $$('.step',screen).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i; if(i<placed)return;
      if(i===placed){placed++;SFX.play('good');draw();const nx=$('#nextR');nx&&nx.focus();}
      else{mistakes++;SFX.play('bad');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}
    });
    const n=$('#nextR'); n&&(n.onclick=()=>done(mistakes));
  }
  draw();
}

/* ---------- shared: one-card-at-a-time sorter ---------- */
function renderSorter(head,R,done){

  draw();
