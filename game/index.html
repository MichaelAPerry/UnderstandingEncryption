/* =====================================================================
   MISSION 7 — GET CERTIFIED (CSR, chain, CA/RA)
   ===================================================================== */
function getCertified(){
  const ROUNDS=[
    {title:'Round 1: Request a certificate',sub:'You run quokkabank.com and need a certificate. Tap the steps in the order they happen.',steps:[
      'Generate a key pair and keep the private key',
      'Send your public key in a Certificate Signing Request (CSR)',
      'The CA (through its Registration Authority) verifies you are who you claim',
      'The CA inserts your public key into the certificate and signs it with the CA’s private key',
      'The certificate is issued back to you'],
     why:'The CSR never contains your private key. The CA signs with <b>its own</b> private key, and that signature is what browsers check.'},
    {title:'Round 2: Walk the chain of trust',sub:'A browser visits www.quokkabank.com. Tap the certificates from the one the site sends first up to the one the browser already trusts.',steps:[
      'Leaf certificate: www.quokkabank.com',
      'Intermediate CA: Veridian TLS CA 3 (signed the leaf)',
      'Root CA: Veridian Root CA (signed the intermediate, self-signs itself)',
      'Trust store: the root certificate is already installed on the client'],
     why:'A two-tier hierarchy keeps the root CA offline and protected. Intermediates do the day-to-day signing. If the root is compromised, the whole PKI is untrusted.'},
  ];
  let mistakes=0;
  const head=shell('m7')+`<p class="story">Mission 9 will ask you to trust a public key because of a certificate. First, see where certificates come from.</p>`;
  const runRound=r=>renderOrder(head,ROUNDS[r],m=>{mistakes+=m;if(r+1<ROUNDS.length)runRound(r+1);else finalQuiz();},r+1<ROUNDS.length?'Next round':'Final round: quick check');
  function finalQuiz(){
    const Q=[
      {q:'Which key does the CA use to sign your certificate?',o:['Your private key','The CA’s private key','The CA’s public key','Your public key'],a:1,e:'The CA signs with its private key. Anyone can verify that signature with the CA’s public key, which sits in the root certificate.'},
      {q:'What is the Registration Authority’s job?',o:['It verifies the requester’s identity for the CA. It is subordinate to the CA.','It is the root of trust.','It revokes certificates by itself.'],a:0,e:'The RA handles identity checks as a subordinate of the root CA, so the CA can focus on signing.'},
      {q:'Your intranet server uses a self-signed certificate. A laptop that has never seen it will…',o:['Trust it, because it’s encrypted.','Warn that it’s untrusted, because no CA in its trust store vouches for it.','Ask the RA.'],a:1,e:'Self-signed certificates aren’t signed by a trusted CA, so they’re untrusted unless you add them to the trust store yourself.'},
      {q:'A single-CA hierarchy is simple, but it has one big weakness. What is it?',o:['It can’t issue wildcards.','It’s a single point of failure with higher risk of compromise.','It needs OCSP.'],a:1,e:'One CA doing everything is a SPoF. Two-tier hierarchies protect the root and delegate to intermediates.'},
    ];
    renderQuiz(shell('m7'),Q,score=>{
      const stars=mistakes<=1&&score>=3?3:mistakes<=4&&score>=2?2:1;
      endMission('m7',stars,'Certified',[
        '<b>CSR flow:</b> generate the key pair and keep the private key, send the public key in a CSR, the CA or RA authenticates you, the CA signs with its private key, and the certificate is issued.',
        '<b>Certificates</b> bind an identity (subject, SAN) to a public key. They include a validity period and the issuer, and are signed by the CA.',
        '<b>Root of trust:</b> the root CA certificate is self-signed and installed on clients. Root → intermediate → leaf is a two-tier hierarchy.',
        'The <b>RA</b> is subordinate to the root CA and verifies identities. <b>Self-signed</b> certificates are untrusted without PKI.'],
        `<p>Ordering mistakes: ${mistakes} · Quiz: ${score}/4</p>`);
    });
  }
  runRound(0);
}

/* =====================================================================
   MISSION 8 — CHECKPOINT (certificate validation, timed)

function checkpoint(){
  const TODAY=Date.UTC(2026,2,14), DAY=864e5;
  const fmt=t=>new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});
  const TRUSTED=['Veridian Root CA','Polaris Global Root R2','Anchorline Root X1'];
  const INTER=[['Veridian TLS CA 3','Veridian Root CA'],['Polaris DV CA','Polaris Global Root R2'],['Anchorline Issuing CA 1','Anchorline Root X1']];
  const SITES=['quokkabank.com','lumenmail.net','tidalshop.io','pinecrest.edu','orbitair.com','fernfit.app','harborhealth.org','mapleledger.com','gladecloud.dev'];
  const serial=()=>[...Array(6)].map(()=>rnd(0,255).toString(16).padStart(2,'0')).join(':').toUpperCase();
  const REASONS={date:'Expired or not yet valid',name:'Name doesn’t match',trust:'Untrusted issuer',revoked:'Revoked or suspended',sig:'Bad signature'};
  function base(site){
    const host=pick(['www.','login.','app.','mail.'])+site, from=TODAY-rnd(20,300)*DAY;
    return {host,cn:host,san:[host,site],chain:pick(INTER),from,to:from+398*DAY,serial:serial(),sig:true,crl:[],ocsp:'good',answer:'ok'};
  }
  const TYPES={
    ok:s=>Object.assign(base(s),{why:'Everything checks out: dates, name, chain to a trusted root, not revoked, signature valid.'}),
    wild:s=>{const c=base(s);c.host='shop.'+s;c.cn='*.'+s;c.san=['*.'+s,s];c.why=`*.${s} covers exactly one label, like shop.${s}. Everything else checks out.`;return c;},
    expired:s=>{const c=base(s);c.to=TODAY-rnd(1,45)*DAY;c.from=c.to-398*DAY;c.answer='date';c.why=`The certificate expired on ${fmt(c.to)}. Today is ${fmt(TODAY)}.`;return c;},
    notyet:s=>{const c=base(s);c.from=TODAY+rnd(3,40)*DAY;c.to=c.from+398*DAY;c.answer='date';c.why=`The certificate isn’t valid until ${fmt(c.from)}.`;return c;},
    lookalike:s=>{const c=base(s);const [n,t]=s.split('.');const fake=pick([n.replace(/o/,'0')!==n?n.replace(/o/,'0')+'.'+t:n+'-secure.'+t,n+'-login.'+t,n+'.'+(t==='com'?'co':'com')]);c.cn='www.'+fake;c.san=['www.'+fake,fake];c.answer='name';c.why=`You’re visiting ${c.host}, but the certificate’s SAN lists only ${c.san.join(', ')}. A lookalike name.`;return c;},
    apex:s=>{const c=base(s);c.host=s;c.cn='*.'+s;c.san=['*.'+s];c.answer='name';c.why=`A wildcard *.${s} covers one label, like www.${s}. It doesn’t cover the bare domain ${s}, and the SAN doesn’t list it.`;return c;},
    deep:s=>{const c=base(s);c.host='eu.shop.'+s;c.cn='*.'+s;c.san=['*.'+s,s];c.answer='name';c.why=`*.${s} matches exactly one label. eu.shop.${s} has two, so it isn’t covered.`;return c;},
    self:s=>{const c=base(s);c.chain=[c.host+' (self-signed)'];c.answer='trust';c.why='Self-signed: the issuer is the subject itself. No CA in your trust store vouches for it.';return c;},
    shady:s=>{const c=base(s);c.chain=['ShadyTrust Issuing CA','ShadyTrust Root'];c.answer='trust';c.why='The chain ends at “ShadyTrust Root”, which isn’t in your trust store.';return c;},
    crl:s=>{const c=base(s);c.crl=[{serial:c.serial,reason:'keyCompromise'}];c.ocsp='revoked (keyCompromise)';c.answer='revoked';c.why='The serial number is on the CRL with reason keyCompromise.';return c;},
    hold:s=>{const c=base(s);c.crl=[{serial:c.serial,reason:'certificateHold'}];c.ocsp='revoked (certificateHold)';c.answer='revoked';c.why='certificateHold is a suspension. It may be reinstated later, but right now the certificate is not valid.';return c;},
    ocsp:s=>{const c=base(s);c.ocsp='revoked (keyCompromise) at 09:12 today';c.answer='revoked';c.why='Not on the CRL because the CRL was downloaded yesterday. OCSP gives real-time status, and it says revoked this morning.';return c;},
    sig:s=>{const c=base(s);c.sig=false;c.answer='sig';c.why='The issuer’s signature doesn’t verify with the issuer’s public key, so the certificate was altered or forged.';return c;},
  };
  const bad=shuffle(['expired','notyet','lookalike','apex','deep','self','shady','crl','hold','ocsp','sig']).slice(0,7);
  const sites=shuffle(SITES);
  const queue=shuffle(['ok','ok','wild',...bad]).map((t,i)=>{const c=TYPES[t](sites[i%sites.length]);c.type=t;
    const decoys=[...Array(rnd(2,4))].map(()=>({serial:serial(),reason:pick(['keyCompromise','superseded','cessationOfOperation','certificateHold'])}));
    c.crlList=shuffle(decoys.concat(c.crl)); return c;});
  const LIMIT=45;
  const st={i:0,score:0,strikes:0,correct:0,t0:performance.now(),paused:false,ocspShown:false,left:LIMIT};
  let iv=null;
  function start(){stop();iv=setInterval(()=>{if(st.paused)return;st.left=LIMIT-(performance.now()-st.t0)/1000;const el=$('#cpTime');if(el)el.textContent=Math.max(0,Math.ceil(st.left))+'s';const bar=$('#cpBar');if(bar)bar.style.width=Math.max(0,st.left/LIMIT*100)+'%';if(st.left<=0)decide(null);},100);}
  function stop(){if(iv){clearInterval(iv);iv=null;}}
  cleanup=stop;
  function render(){
    const c=queue[st.i];
    screen.innerHTML=shell('m8')+`<p class="story">You are the browser. For each site, check the certificate, then trust it or block it with the reason. Wrongly trusting a bad certificate is a strike. Three strikes ends your shift.</p>
    <div class="hud"><span>Cert <b>${st.i+1}</b>/${queue.length}</span><span>Score <b>${st.score}</b></span><span>Strikes <span class="strikes">${[0,1,2].map(k=>`<i class="${k<st.strikes?'on':''}"></i>`).join('')}</span></span><span>Time <b id="cpTime">${Math.ceil(st.left)}s</b></span><span>Today <b>${fmt(TODAY)}</b></span></div>
    <div class="timerbar" style="margin-bottom:12px"><i id="cpBar" style="width:${st.left/LIMIT*100}%"></i></div>
    <div class="cp"><div>
      <div class="addr" aria-label="Address bar">${ICON.lock('var(--muted)',false).replace('class="ic"','class="ic" style="width:16px;height:16px"')}https://${esc(c.host)}/</div>
      <div class="cert"><h4>X.509 Certificate</h4><dl>
        <dt>Subject CN</dt><dd>${esc(c.cn)}</dd>
        <dt>SAN (DNS)</dt><dd>${c.san.map(esc).join(', ')}</dd>
        <dt>Issuer chain</dt><dd><div class="chain">${[c.cn].concat(c.type==='self'?[]:c.chain).map(x=>`<span>${esc(x)}</span>`).join('')}${c.type==='self'?`<span>${esc(c.chain[0])}</span>`:''}</div></dd>
        <dt>Valid from</dt><dd>${fmt(c.from)}</dd><dt>Valid to</dt><dd>${fmt(c.to)}</dd>
        <dt>Serial</dt><dd>${c.serial}</dd>
        <dt>Signature</dt><dd class="${c.sig?'sigok':'sigbad'}">${c.sig?'Verifies with issuer’s public key':'Does NOT verify with issuer’s public key'}</dd>
      </dl></div>
      <div class="verdicts"><button type="button" class="vbtn trust" data-v="ok">Trust and connect</button>${Object.entries(REASONS).map(([k,v])=>`<button type="button" class="vbtn" data-v="${k}">Block: ${v}</button>`).join('')}</div>
    </div>
    <aside class="card manual"><h4>Trust store (roots)</h4><ul>${TRUSTED.map(t=>`<li>${t}</li>`).join('')}</ul>
      <h4>CRL · downloaded ${fmt(TODAY-DAY)} 02:00</h4><ul>${c.crlList.map(r=>`<li>${r.serial} · ${r.reason}</li>`).join('')}</ul>
      <h4>OCSP (real-time)</h4><button type="button" class="btn sm" id="ocspBtn">Query OCSP for this serial</button>${st.ocspShown?`<div class="ocsp">Status: <b class="${c.ocsp==='good'?'sigok':'sigbad'}">${c.ocsp}</b></div>`:''}
      <h4>Checklist</h4><ul style="font-family:var(--f-body);font-size:14px"><li>Dates include today?</li><li>Host matches a SAN entry? (* = one label)</li><li>Chain ends at a trusted root?</li><li>Not on CRL, and OCSP says good?</li><li>Signature verifies?</li></ul></aside></div>`;
    wireHome();
    $$('[data-v]',screen).forEach(b=>b.onclick=()=>decide(b.dataset.v));
    $('#ocspBtn').onclick=()=>{SFX.play('click');st.ocspShown=true;render();};
  }
  function decide(v){
    if(st.paused)return; st.paused=true;
    const c=queue[st.i]; let title,tone,msg;
    if(v===null){st.strikes++;title='Time’s up';tone='fail';msg='The user gave up waiting. Counts as a strike.';}
    else if(v===c.answer){const bonus=Math.max(0,Math.round(st.left));st.score+=100+bonus;st.correct++;title=v==='ok'?'Correct: safe to connect':'Correct: blocked';tone='win';msg=`+${100+bonus} points.`;}
    else if(v==='ok'){st.strikes++;title='You trusted a bad certificate';tone='fail';msg='Strike. An attacker could now read or change this traffic.';}
    else if(c.answer==='ok'){title='False alarm';tone='fail';msg='That certificate was fine. No points, but no strike.';}
    else{st.score+=40;title='Blocked, wrong reason';tone='info';msg=`+40 points. Blocking was right, but the reason was “${REASONS[c.answer]}”.`;}
    SFX.play(tone==='win'?'coin':title.startsWith('You trusted')||v===null?'alarm':'bad');
    const endNow=st.strikes>=3, last=st.i+1>=queue.length;
    modal({title,tone,html:`<p>${msg}</p><p class="explain">${c.why}</p>`,actions:[{label:endNow?'Shift over':last?'See results':'Next certificate',primary:true,fn:()=>{
      if(endNow||last) return finish(endNow);
      st.i++;st.ocspShown=false;st.paused=false;st.t0=performance.now();st.left=LIMIT;render();
    }}]});
  }
  function finish(fired){
    stop();
    const acc=st.correct/queue.length;
    const stars=fired?1:acc>=.9?3:acc>=.7?2:1;
    endMission('m8',stars,fired?'Three strikes':'Shift complete',[
      '<b>Validity period:</b> the certificate must be within its from/to dates today.',
      '<b>Subject Alternative Name (SAN):</b> the browser checks that the site’s FQDN matches a SAN entry. A <b>wildcard</b> (*.site.com) covers one level of subdomain. It doesn’t cover the bare domain or deeper levels.',
      '<b>Chain of trust:</b> the chain must end at a root CA in the client’s trust store. Self-signed and unknown roots are untrusted.',
      '<b>Revocation:</b> a <b>CRL</b> is a downloaded list and can be stale. <b>OCSP</b> checks one certificate in real time. A <b>suspension</b> (certificateHold) can be reinstated. A <b>revocation</b> can’t.',
      'The CA’s <b>signature</b> must verify with the issuer’s public key. If it doesn’t, the certificate was tampered with.'],
      `<p>Score ${st.score} · ${st.correct}/${queue.length} fully correct · ${st.strikes} strike${st.strikes===1?'':'s'}</p>`);
  }
  render(); start();
}

/* =====================================================================
   MISSION 11 — CHAIN BREAKER (blockchain tamper-evidence, slide 27)
   Eve edits a ledger entry; the hash links expose her instantly.
   The lesson is that the chain makes tampering visible, not that it succeeds.
   ===================================================================== */
function chainBreaker(){
  const H=x=>sha256(x).slice(0,12);
  const TX=[['Genesis block','—'],['Alice pays Bob','5 coins'],['Bob pays Carol','2 coins'],['Dave pays Alice','9 coins'],['Carol pays Erin','1 coin']];
  function build(){
    const blocks=[]; let prev='000000000000';
    TX.forEach(([what,amt],i)=>{const b={i,what,amt,prev,nonce:0};b.hash=H(i+what+amt+prev+b.nonce);blocks.push(b);prev=b.hash;});
    return blocks;
  }
  const st={blocks:build(),phase:'intro',edited:null,recomputed:new Set(),done:false};
  function valid(b,idx){const good=H(b.i+b.what+b.amt+b.prev+b.nonce)===b.hash;const linked=idx===0||b.prev===st.blocks[idx-1].hash;return good&&linked;}
  function render(){
    const firstBad=st.blocks.findIndex((b,i)=>!valid(b,i));
    screen.innerHTML=shell('m11')+`<p class="story">The Wire Room keeps a public ledger. Each block stores the <b>hash of the block before it</b>, so the blocks form a chain. Play as Eve: change a payment in your favor, then try to make the chain look untouched.</p>
    <div class="ledger">${st.blocks.map((b,i)=>{const ok=valid(b,i);return `<div class="block ${ok?'':'bad'} ${st.edited===i?'edited':''}">
      <div class="blk-h"><span class="lbl">Block ${b.i}</span>${ok?'<span class="ok-tag">valid</span>':'<span class="bad-tag">broken</span>'}</div>
      <div class="blk-body"><label>Data</label>${i>0&&st.phase!=='intro'?`<input class="inp mono blk-what" data-i="${i}" value="${esc(b.what)}"> <input class="inp mono blk-amt" data-i="${i}" value="${esc(b.amt)}" style="flex:0 1 110px">`:`<div class="mono">${esc(b.what)}${b.amt!=='—'?' · '+esc(b.amt):''}</div>`}
        <label>Prev hash</label><div class="mono small ${i>0&&b.prev!==st.blocks[i-1].hash?'mism':''}">${b.prev}</div>
        <label>Nonce</label><div class="row"><span class="mono">${b.nonce}</span>${st.phase==='fix'&&!valid(b,i)?`<button type="button" class="btn sm" data-mine="${i}">Recompute this block</button>`:''}</div>
        <label>This hash</label><div class="mono small">${b.hash}</div></div>
      ${i<st.blocks.length-1?`<div class="chain-link ${b.hash===st.blocks[i+1].prev?'':'cut'}"></div>`:''}</div>`;}).join('')}</div>
    <div class="card" id="cbPanel"></div>`;
    wireHome();
    const P=$('#cbPanel');
    if(st.phase==='intro'){
      P.innerHTML=`<h3>The ledger checks out</h3><p>Every block’s stored hash matches its contents, and every block’s “prev hash” matches the real hash of the block before it. Now go change block 1 so Alice pays <b>you</b> 500 instead of paying Bob 5.</p><div class="choices"><button type="button" class="btn primary" id="cbEdit">Start editing</button></div>`;
      $('#cbEdit').onclick=()=>{SFX.play('click');st.phase='edit';render();};
    }else if(firstBad>=0){
      P.innerHTML=`<h3 class="warn-h">Chain broken at block ${firstBad}</h3><p>You changed the data, so block ${firstBad}’s contents no longer match its stored hash — and every block after it points back to a hash that no longer exists. On a real network, hundreds of peers see the mismatch at once and reject your copy.</p>
      <p>Think you can patch it? ${st.phase==='fix'?'Recompute the broken blocks one by one and watch what happens.':''}</p>
      <div class="choices">${st.phase!=='fix'?'<button type="button" class="btn primary" id="cbTryFix">Try to cover it up</button>':'<button type="button" class="btn" id="cbReset">Reset the ledger</button>'}</div>`;
      const tf=$('#cbTryFix'); tf&&(tf.onclick=()=>{SFX.play('click');st.phase='fix';render();});
      const rs=$('#cbReset'); rs&&(rs.onclick=()=>{st.blocks=build();st.phase='edit';render();});
    }else if(st.edited!=null){
      P.innerHTML=`<h3 class="warn-h">You patched every block… and it still doesn’t help</h3><p>You recomputed each block so the chain is internally consistent again. But this is <b>your</b> copy. The honest network still holds the original chain, and its blocks have different hashes from yours. To overwrite theirs you’d have to out-compute the entire network — and keep out-computing it forever.</p>
      <div class="choices"><button type="button" class="btn primary" id="cbFinish">That’s the point</button><button type="button" class="btn" id="cbReset2">Reset</button></div>`;
      $('#cbFinish').onclick=finish;
      $('#cbReset2').onclick=()=>{st.blocks=build();st.edited=null;st.phase='edit';render();};
    }else{
      P.innerHTML=`<h3>Chain intact</h3><p>Edit block 1’s data to break it, or press below if you’re convinced.</p><div class="choices"><button type="button" class="btn primary" id="cbFinish2">Wrap up</button></div>`;
      $('#cbFinish2').onclick=finish;
    }
    $$('.blk-what,.blk-amt',screen).forEach(inp=>inp.oninput=()=>{
      const i=+inp.dataset.i;
      st.blocks[i].what=$(`.blk-what[data-i="${i}"]`).value;
      st.blocks[i].amt=$(`.blk-amt[data-i="${i}"]`).value;
      if(st.edited===null)st.edited=i;
      SFX.play('tick');
      const fb=st.blocks.findIndex((b,j)=>!valid(b,j));
      if(fb>=0)SFX.play('bad');
      render();
    });
    $$('[data-mine]',screen).forEach(b=>b.onclick=()=>{
      const i=+b.dataset.mine;
      if(i>0)st.blocks[i].prev=st.blocks[i-1].hash;
      st.blocks[i].hash=H(st.blocks[i].i+st.blocks[i].what+st.blocks[i].amt+st.blocks[i].prev+st.blocks[i].nonce);
      st.recomputed.add(i);SFX.play('mine');
      st.edited=st.blocks.findIndex((b,j)=>!valid(b,j))<0?st.edited:st.edited;
      if(st.blocks.every((b,j)=>valid(b,j)))st.edited=st.edited??1;
      render();
    });
  }
  function finish(){
    const stars=st.phase==='fix'||st.edited!=null?3:st.phase==='edit'?2:1;
    endMission('m11',stars,'Tamper-evident',[
      'A <b>blockchain</b> is an expanding list of records where each block is hashed together with the <b>hash of the previous block</b>.',
      'That linking makes the chain <b>tamper-evident</b>: change any past record and its hash changes, breaking every block after it.',
      'The ledger is an <b>open, public, decentralized</b> record distributed across a peer-to-peer network. To rewrite history you’d have to out-compute the whole network, which is why old blocks are effectively permanent.',
      'Uses include cryptocurrency, data registries, digital identity, and supply-chain tracking.']);
  }
  render();
}

/* =====================================================================
   MISSION 12 — HIDE IN PLAIN SIGHT (obfuscation, slides 24–25)
   ===================================================================== */
function hideInPlainSight(){
  const st={phase:'steg',found:false,scan:0};
  const MSG='MEET AT PIER 7';
  function render(){
    if(st.phase==='sort') return sortPart();
    const revealed=st.scan>=100;
    screen.innerHTML=shell('m12')+`<p class="story">Sometimes the goal isn’t to scramble a message — it’s to hide that there’s a message at all. That’s <b>obfuscation</b>. First up: <b>steganography</b>, hiding data inside an ordinary-looking file.</p>
    <div class="two"><div class="card"><h3>Harbor photo <span class="muted" style="font-weight:400">harbor.png</span></h3>
      <div class="stego" aria-label="A photo of a harbor">
        <svg viewBox="0 0 320 180" width="100%" role="img" aria-label="Stylized harbor at dusk">
          <rect width="320" height="180" fill="#2b4a63"/><rect y="120" width="320" height="60" fill="#16303f"/>
          <circle cx="255" cy="45" r="22" fill="#e8b06a"/>
          <rect x="30" y="70" width="16" height="50" fill="#0e2331"/><rect x="52" y="55" width="14" height="65" fill="#0e2331"/><rect x="72" y="80" width="18" height="40" fill="#0e2331"/>
          <path d="M120 120 L140 95 L160 120Z" fill="#0e2331"/><rect x="137" y="95" width="6" height="25" fill="#0e2331"/>
          <path d="M200 120 L215 100 L230 120Z" fill="#0b1b26"/>
          <rect class="scanline" x="0" y="0" width="320" height="2" fill="#6ff0c0" style="transform:translateY(${st.scan*1.78}px);opacity:${revealed?0:.85}"/>
          ${revealed?`<g font-family="JetBrains Mono, monospace" font-size="9" fill="#6ff0c0">${[...MSG].map((ch,i)=>`<text x="${14+i*20}" y="150">${ch===' '?'·':ch}</text>`).join('')}</g>`:''}
        </svg></div>
      <p class="muted" style="font-size:14px">The picture looks completely normal. The hidden data lives in the <b>least significant bit</b> of each pixel’s color — a change too small for the eye to see.</p>
      <div class="choices">${revealed?`<div class="explain" style="flex:1 1 100%"><b>Found it:</b> “${MSG}”. It was there the whole time, riding in bits that don’t change how the image looks.</div>`:`<button type="button" class="btn primary" id="scanBtn">Extract the low bits</button>`}</div>
    </div>
    <div class="card"><h3>Why hide, not encrypt?</h3><ul style="margin:0;padding-left:18px">
      <li>Encryption hides <em>what</em> a message says. It still shouts <em>that</em> a secret exists.</li>
      <li>Steganography hides <em>that there is a message</em> inside an innocent cover: an image, audio, video, a document, even a network protocol.</li>
      <li>It’s also used to prove <b>integrity</b> and <b>non-repudiation</b> (digital watermarks) and to run <b>covert channels</b>.</li>
      <li>Weakness: no confidentiality on its own. Once someone knows where to look, the data is right there. Serious use combines it with encryption.</li></ul>
      ${revealed?'<div class="choices"><button type="button" class="btn primary" id="toSort">Next: obfuscation methods</button></div>':''}</div></div>`;
    wireHome();
    const sc=$('#scanBtn'); sc&&(sc.onclick=()=>{
      SFX.play('hash');let n=0;const iv=setInterval(()=>{st.scan=Math.min(100,st.scan+8);render();if(st.scan>=100){clearInterval(iv);SFX.play('coin');st.found=true;}},60);
    });
    const ts=$('#toSort'); ts&&(ts.onclick=()=>{SFX.play('click');st.phase='sort';render();});
  }
  function sortPart(){
    const head=shell('m12')+`<p class="story">Obfuscation has more than one tool. Sort each example into the right method.</p>`;
    renderSorter(head,{title:'Which method?',bins:['Steganography','Tokenization','Data masking'],
      items:[
        {q:'A credit-card number is swapped for a random value; the real number sits in a separate secure vault and can be retrieved with the token.',a:'Tokenization',e:'Tokenization replaces sensitive data with a random, non-sensitive substitute. It’s reversible through the vault by an authorized request.'},
        {q:'On the support screen a Social Security number shows as xxx-xx-6789.',a:'Data masking',e:'Data masking hides all or part of a dataset, showing substitute characters in place of the original. Often it’s one-way for display.'},
        {q:'A shipping manifest is embedded invisibly inside a product photo posted publicly.',a:'Steganography',e:'Steganography conceals data inside a non-secret cover medium so no one suspects a message is present.'},
        {q:'A payment app stores a random stand-in for your card so a breach of the app leaks no real card numbers, but checkout still works.',a:'Tokenization',e:'The token maps back to the real value only inside the vault, so the app never holds the sensitive data itself.'},
        {q:'A test database shows realistic-looking but scrambled names and account numbers so developers never see real customer data.',a:'Data masking',e:'Masking substitutes hidden or altered values so the shape of the data is usable while the real values stay hidden.'},
        {q:'A message is tucked into the unused fields of a network protocol to slip past a monitor.',a:'Steganography',e:'A covert channel hides data inside an ordinary carrier — here, a protocol’s own structure.'},
      ]},(score,total)=>{
        const stars=score>=total-1?3:score>=total-2?2:1;
        endMission('m12',stars,'Hidden and sorted',[
          '<b>Obfuscation</b> makes data unclear or hard to understand — sometimes hiding that a secret exists at all.',
          '<b>Steganography</b> conceals a message inside a non-secret cover (image, audio, video, document, network protocol). It can also carry watermarks for integrity and run covert channels. It gives no confidentiality by itself.',
          '<b>Tokenization</b> replaces sensitive data with a random token; the original is retrievable from a secure vault, so it’s reversible for authorized requests.',
          '<b>Data masking</b> substitutes hidden characters for all or part of a value (123-45-6789 → xxx-xx-6789), showing usable but non-sensitive data.'],
          `<p>Sorted ${score} of ${total} correctly.</p>`);
      });
  }
  render();
}

/* =====================================================================
   MISSION 13 — VAULT KEEPER (key escrow, KMS lifecycle, TPM/HSM; slides 23, 29-30)
   ===================================================================== */
function vaultKeeper(){
  const head=shell('m13')+`<p class="story">Every key needs a safe home and a life plan. Part one: put each key in the right kind of storage. Part two: order a key’s lifecycle. Part three: a quick check.</p>`;
  function part1(){
    renderSorter(head,{title:'Where does this key live?',bins:['TPM','HSM','Key escrow','Secure enclave'],
      items:[
        {q:'A laptop needs a chip soldered to its motherboard to store the disk-encryption key and verify secure boot.',a:'TPM',e:'A Trusted Platform Module is hardware embedded in the chipset or CPU. It creates and stores keys and supports secure boot.'},
        {q:'A bank needs a tamper-resistant PCIe card that generates and guards thousands of certificate keys for its data center.',a:'HSM',e:'A Hardware Security Module is a plug-in card, network appliance, or USB device dedicated to key generation and storage at scale.'},
        {q:'A company must keep a backup copy of its keys with a trusted third party in case an employee leaves and the original is lost.',a:'Key escrow',e:'Key escrow is secure third-party storage of key copies and backups. It carries the same powers and risks as the original key.'},
        {q:'Keys loaded into system RAM must be walled off so other processes on the machine can’t read them.',a:'Secure enclave',e:'A secure enclave protects keys loaded into RAM from unauthorized access by the rest of the system.'},
        {q:'A phone generates a per-device key that never leaves a protected region of the processor.',a:'Secure enclave',e:'The enclave isolates keys in memory from the rest of the system, even the OS.'},
        {q:'A court order requires that a copy of an encryption key be recoverable later from a trusted custodian.',a:'Key escrow',e:'Escrow keeps recoverable copies with a trusted third party — useful for recovery, but the copy is as sensitive as the original.'},
      ]},()=>part2());
  }
  function part2(){
    renderOrder(head,{title:'The key lifecycle',sub:'A centralized Key Management System handles a key from cradle to grave. Tap the stages in order.',
      steps:['Generation','Distribution','Storage','Renewal','Expiration','Revocation','Destruction'],
      why:'A <b>Key Management System (KMS)</b> is centralized and performs the whole lifecycle. Decentralized key management leaves each stage to individual owners. Hardware cryptoprocessors (TPM, HSM) carry out the storage and generation stages securely.'},
    ()=>part3());
  }
  function part3(){
    const Q=[
      {q:'Your app must store user passwords. Which is the right practice?',o:['Store the plaintext password','Store hash(salt + password) and run it through many rounds (key stretching, e.g. PBKDF2)','Encrypt each password with one shared key','Store the password reversed'],a:1,e:'Salting adds entropy so identical passwords hash differently and rainbow tables don’t work; key stretching (PBKDF2) adds rounds so each guess is slow. That’s the slide-26 defense.'},
      {q:'What is the main risk of key escrow?',o:['It’s slower than normal storage','The escrowed copy has the same power and vulnerabilities as the original key','It only works for symmetric keys','It expires automatically'],a:1,e:'A stored copy can do everything the original can, so escrow storage must be protected as strongly as the key itself.'},
      {q:'TPM vs HSM — which statement is right?',o:['TPM is embedded in a device’s chipset/CPU; HSM is a separate card, appliance, or USB module','They’re the same thing','HSM is built into the CPU; TPM is a network appliance','Neither can generate keys'],a:0,e:'A TPM is embedded hardware for one machine; an HSM is dedicated, often external hardware built to manage many keys.'},
      {q:'A key has reached its expiration date. What should a KMS do next?',o:['Keep using it','Move it through revocation and destruction','Email it to the owner','Publish it'],a:1,e:'Expiration leads to revocation and secure destruction — the end of the managed lifecycle.'},
    ];
    renderQuiz(head,Q,score=>{
      const stars=score>=4?3:score>=3?2:1;
      endMission('m13',stars,'Vault keeper',[
        '<b>Key escrow</b> is secure storage of key copies with a trusted third party; the copy carries the same powers and risks as the original.',
        'A <b>Key Management System</b> is centralized and runs the full <b>lifecycle</b>: generation, distribution, storage, renewal, expiration, revocation, destruction.',
        '<b>Hardware cryptoprocessors:</b> a <b>TPM</b> is embedded in the chipset/CPU (key storage, secure boot); an <b>HSM</b> is a plug-in card, appliance, or USB module; a <b>secure enclave</b> protects keys loaded into RAM.',
        '<b>Salting</b> and <b>key stretching</b> (PBKDF2) protect stored password hashes: salt defeats rainbow tables, stretching slows every guess.'],
        `<p>Quiz: ${score}/4</p>`);
    });
  }
  part1();
}

$('#soundBtn').onclick=()=>{SFX.toggle();drawSound();};
drawSound();

if(window.claude&&window.claude.hot&&window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({screen:current}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
